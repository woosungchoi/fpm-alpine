name: dependency-auto-merge

on:
  schedule:
    - cron: '17 * * * *'
  repository_dispatch:
    types: [dependency-auto-merge]

permissions: {}

concurrency:
  group: dependency-auto-merge
  cancel-in-progress: false

jobs:
  select:
    if: >-
      ${{ github.ref == 'refs/heads/main' &&
          (github.event_name == 'schedule' ||
           (github.event_name == 'repository_dispatch' &&
            github.event.action == 'dependency-auto-merge')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      pull-requests: read
      checks: read
    outputs:
      eligible_count: ${{ steps.evaluate.outputs.eligible_count }}
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: List and preselect open dependency PRs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p auto-merge-selection
          gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 100 \
            --json number,author,baseRefName,headRefName,headRepository,isCrossRepository,isDraft,reviewDecision \
            > auto-merge-selection/open-prs.json
          python3 scripts/select-auto-merge-prs.py \
            --input auto-merge-selection/open-prs.json \
            --repository "$GITHUB_REPOSITORY" \
            --selected-output auto-merge-selection/preselected.txt \
            --report-output auto-merge-selection/preselection.json

      - name: Revalidate the oldest selected PR only
        id: evaluate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          : > auto-merge-selection/eligible.tsv
          pr=""
          IFS= read -r pr < auto-merge-selection/preselected.txt || true
          if [ -n "$pr" ]; then
            set +e
            ./scripts/evaluate-auto-merge-pr.sh \
              "$pr" "$GITHUB_REPOSITORY" auto-merge-selection/eligible.tsv
            rc=$?
            set -e
            if [ "$rc" -ne 0 ] && [ "$rc" -ne 2 ]; then
              exit "$rc"
            fi
          fi
          count=$(wc -l < auto-merge-selection/eligible.tsv | tr -d ' ')
          [ "$count" -le 1 ]
          echo "eligible_count=$count" >> "$GITHUB_OUTPUT"

      - name: Upload selection evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: auto-merge-selection-${{ github.run_id }}-${{ github.run_attempt }}
          path: auto-merge-selection/
          if-no-files-found: error

  enable-native-auto-merge:
    if: >-
      ${{ github.ref == 'refs/heads/main' &&
          needs.select.outputs.eligible_count != '0' &&
          vars.DEPENDENCY_AUTO_MERGE_ENABLED == 'true' &&
          (github.event_name == 'schedule' ||
           (github.event_name == 'repository_dispatch' &&
            github.event.action == 'dependency-auto-merge' &&
            toJSON(github.event.client_payload.report_only) == 'false')) }}
    needs: select
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
      pull-requests: write
      checks: read
    steps:
      - name: Checkout trusted main for mutation-time revalidation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download exact selection evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: auto-merge-selection-${{ github.run_id }}-${{ github.run_attempt }}
          path: auto-merge-selection

      - name: Rebind exact head and enable native auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current_main="$(gh api \
            "repos/$GITHUB_REPOSITORY/git/ref/heads/main" \
            --jq '.object.sha')"
          test "$current_main" = "$GITHUB_SHA"
          while IFS=$'\t' read -r pr selected_sha; do
            test -n "$pr" || continue
            revalidated="$(mktemp)"
            trap 'rm -f "$revalidated"' EXIT
            ./scripts/evaluate-auto-merge-pr.sh \
              "$pr" "$GITHUB_REPOSITORY" "$revalidated"
            IFS=$'\t' read -r revalidated_pr revalidated_sha < "$revalidated"
            test "$revalidated_pr" = "$pr"
            test "$revalidated_sha" = "$selected_sha"
            current=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr")
            current_sha=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["head"]["sha"])' <<< "$current")
            current_state=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["state"])' <<< "$current")
            current_draft=$(python3 -c 'import json,sys; print(str(json.load(sys.stdin)["draft"]).lower())' <<< "$current")
            current_base_ref=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["base"]["ref"])' <<< "$current")
            current_base_repo=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["base"]["repo"]["full_name"])' <<< "$current")
            current_base_sha=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["base"]["sha"])' <<< "$current")
            current_head_ref=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["head"]["ref"])' <<< "$current")
            current_head_repo=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["head"]["repo"]["full_name"])' <<< "$current")
            test "$current_sha" = "$selected_sha"
            test "$current_state" = open
            test "$current_draft" = false
            test "$current_base_ref" = main
            test "$current_base_repo" = "$GITHUB_REPOSITORY"
            test "$current_base_sha" = "$current_main"
            test "$current_head_repo" = "$GITHUB_REPOSITORY"
            if [[ "$current_head_ref" =~ ^automation/(base-8\.[2-5]|pecl-(imagick|redis|apcu))-[0-9a-f]{12}$ ]]; then
              lock_sha="$(gh api \
                "repos/$GITHUB_REPOSITORY/git/ref/heads/automation/conveyor-lock" \
                --jq '.object.sha')"
              test "$lock_sha" = "$current_base_sha"
            fi
            gh pr merge "$pr" --repo "$GITHUB_REPOSITORY" --auto --squash --match-head-commit "$selected_sha"
          done < auto-merge-selection/eligible.tsv
