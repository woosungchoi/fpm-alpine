name: dependency-auto-merge

on:
  # Trusted-main code only; the job revalidates the exact successful smoke run
  # and never checks out or executes pull-request code.
  # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows: ["smoke-test"]
    types: [completed]

permissions: {}

concurrency:
  group: dependency-auto-merge-${{ github.event.workflow_run.id }}
  cancel-in-progress: true

jobs:
  enable-native-auto-merge:
    if: >-
      ${{ vars.DEPENDENCY_AUTO_MERGE_ENABLED == 'true' &&
          github.event.workflow_run.event == 'pull_request' &&
          github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
      pull-requests: write
    steps:
      - name: Checkout trusted main workflow code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind the successful smoke run to one same-repository PR
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
          SMOKE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SMOKE_RUN_ID" > /tmp/smoke-run.json
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          import re
          from pathlib import Path

          run = json.loads(Path('/tmp/smoke-run.json').read_text())
          expected_id = int(os.environ['SMOKE_RUN_ID'])
          repository = os.environ['GITHUB_REPOSITORY']
          required = {
              'id': expected_id,
              'path': '.github/workflows/smoke-test.yml',
              'event': 'pull_request',
              'status': 'completed',
              'conclusion': 'success',
          }
          mismatches = [key for key, value in required.items() if run.get(key) != value]
          if mismatches:
              raise SystemExit('smoke run contract mismatch: ' + ', '.join(mismatches))
          if (run.get('head_repository') or {}).get('full_name') != repository:
              raise SystemExit('smoke run head repository is not canonical')
          head_sha = run.get('head_sha')
          if not isinstance(head_sha, str) or not re.fullmatch(r'[0-9a-f]{40}', head_sha):
              raise SystemExit('smoke run head SHA is invalid')
          pulls = run.get('pull_requests')
          if not isinstance(pulls, list) or len(pulls) != 1:
              raise SystemExit('smoke run must bind to exactly one pull request')
          number = pulls[0].get('number') if isinstance(pulls[0], dict) else None
          if type(number) is not int or number < 1:
              raise SystemExit('smoke run pull request number is invalid')
          print(f'pr_number={number}')
          print(f'head_sha={head_sha}')
          PY

      - name: Validate dependency-only PR and enable native auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.run.outputs.pr_number }}
          CHECKED_HEAD_SHA: ${{ steps.run.outputs.head_sha }}
        run: |
          set -euo pipefail
          mkdir -p auto-merge-selection
          : > auto-merge-selection/eligible.tsv
          ./scripts/evaluate-auto-merge-pr.sh \
            "$PR_NUMBER" "$GITHUB_REPOSITORY" auto-merge-selection/eligible.tsv
          test "$(wc -l < auto-merge-selection/eligible.tsv | tr -d ' ')" = 1
          IFS=$'\t' read -r eligible_pr eligible_sha < auto-merge-selection/eligible.tsv
          test "$eligible_pr" = "$PR_NUMBER"
          test "$eligible_sha" = "$CHECKED_HEAD_SHA"
          gh pr merge "$PR_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --auto \
            --squash \
            --match-head-commit "$CHECKED_HEAD_SHA"
