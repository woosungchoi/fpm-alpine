name: dependency-auto-publish

on:
  push:
    branches: ["main"]
    paths:
      - build/versions.json
  workflow_dispatch:
    inputs:
      version:
        description: PHP minor to publish, or all
        required: true
        type: choice
        default: all
        options:
          - all
          - "8.2"
          - "8.3"
          - "8.4"
          - "8.5"

permissions:
  contents: read

concurrency:
  group: dependency-auto-publish
  cancel-in-progress: false

env:
  DOCKERHUB_REPOSITORY: docker.io/woosungchoi/fpm-alpine
  GHCR_REPOSITORY: ghcr.io/woosungchoi/fpm-alpine

jobs:
  prepare:
    name: Select changed PHP minor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      created: ${{ steps.metadata.outputs.created }}
      source_date_epoch: ${{ steps.metadata.outputs.source_date_epoch }}
    steps:
      - name: Checkout merged main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Validate source and select minors
        id: matrix
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          ./scripts/validate-versions.py

          if [ "$EVENT_NAME" = push ]; then
            [[ "$BEFORE_SHA" =~ ^[0-9a-f]{40}$ ]]
            git cat-file -e "${BEFORE_SHA}^{commit}"
            python3 scripts/evaluate-auto-promotion.py \
              --base-sha "$BEFORE_SHA" \
              --head-sha "$GITHUB_SHA" \
              --output /tmp/promotion.json
            selected="$(python3 - <<'PY'
          import json
          data = json.load(open('/tmp/promotion.json'))
          if data.get('eligible') is not True or data.get('class') != 'base-same-minor':
              raise SystemExit('merged change is not one same-minor PHP patch update')
          affected = data.get('affectedMinors')
          if not isinstance(affected, list) or len(affected) != 1:
              raise SystemExit('publisher requires exactly one affected PHP minor')
          print(affected[0])
          PY
            )"
          else
            case "$REQUESTED_VERSION" in
              all) selected=8.2,8.3,8.4,8.5 ;;
              8.2|8.3|8.4|8.5) selected="$REQUESTED_VERSION" ;;
              *) echo "unsupported PHP minor: $REQUESTED_VERSION" >&2; exit 64 ;;
            esac
          fi

          SELECTED_MINORS="$selected" python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          import subprocess

          selected = os.environ['SELECTED_MINORS'].split(',')
          if not selected or any(item not in {'8.2', '8.3', '8.4', '8.5'} for item in selected):
              raise SystemExit('invalid selected PHP minor set')
          rows = json.loads(
              subprocess.check_output(['./scripts/validate-versions.py', '--matrix'])
          )['include']
          matrix = [
              row for row in rows
              if row['arch'] == 'amd64' and row['php_minor'] in selected
          ]
          if {row['php_minor'] for row in matrix} != set(selected):
              raise SystemExit('selected PHP minor is missing from the build matrix')
          print('matrix=' + json.dumps({'include': matrix}, separators=(',', ':')))
          PY

      - name: Capture build metadata
        id: metadata
        run: |
          {
            echo "created=$(git show -s --format=%cI "$GITHUB_SHA")"
            echo "source_date_epoch=$(git show -s --format=%ct "$GITHUB_SHA")"
          } >> "$GITHUB_OUTPUT"

  publish:
    name: Publish ${{ matrix.php_minor }} to Docker Hub and GHCR
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: fpm-auto-production
    permissions:
      contents: read
      packages: write # Push the GHCR minor tag from trusted merged main.
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Checkout merged main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push both registries
        id: build
        env:
          SOURCE_DATE_EPOCH: ${{ needs.prepare.outputs.source_date_epoch }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.DOCKERHUB_REPOSITORY }}:${{ matrix.php_minor }}
            ${{ env.GHCR_REPOSITORY }}:${{ matrix.php_minor }}
          build-args: |
            PHP_BASE_IMAGE=${{ matrix.php_base_image }}
            IMAGICK_URL=${{ matrix.imagick_url }}
            IMAGICK_SHA256=${{ matrix.imagick_sha256 }}
            REDIS_URL=${{ matrix.redis_url }}
            REDIS_SHA256=${{ matrix.redis_sha256 }}
            APCU_URL=${{ matrix.apcu_url }}
            APCU_SHA256=${{ matrix.apcu_sha256 }}
            OCI_SOURCE=${{ github.server_url }}/${{ github.repository }}
            OCI_REVISION=${{ github.sha }}
            OCI_VERSION=${{ matrix.php_patch }}
            OCI_CREATED=${{ needs.prepare.outputs.created }}
            SOURCE_DATE_EPOCH=${{ needs.prepare.outputs.source_date_epoch }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ matrix.php_patch }}
            org.opencontainers.image.created=${{ needs.prepare.outputs.created }}
            org.opencontainers.image.licenses=GPL-2.0-only
          cache-from: type=gha,scope=publisher-${{ matrix.php_minor }}
          cache-to: type=gha,mode=max,scope=publisher-${{ matrix.php_minor }}
          provenance: mode=max
          sbom: true

      - name: Read back both registries
        env:
          BUILD_DIGEST: ${{ steps.build.outputs.digest }}
          PHP_MINOR: ${{ matrix.php_minor }}
        run: |
          set -euo pipefail
          [[ "$BUILD_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          dockerhub_ref="${DOCKERHUB_REPOSITORY}:${PHP_MINOR}"
          ghcr_ref="${GHCR_REPOSITORY}:${PHP_MINOR}"
          resolve_with_retry() {
            local ref="$1" digest=""
            for _ in 1 2 3 4 5; do
              if digest="$(./scripts/resolve-image-digest.sh "$ref" 2>/dev/null)" &&
                 [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
                printf '%s\n' "$digest"
                return 0
              fi
              sleep 2
            done
            printf 'digest read-back failed: %s\n' "$ref" >&2
            return 1
          }
          dockerhub_digest="$(resolve_with_retry "$dockerhub_ref")"
          ghcr_digest="$(resolve_with_retry "$ghcr_ref")"
          test "$dockerhub_digest" = "$BUILD_DIGEST"
          test "$ghcr_digest" = "$BUILD_DIGEST"
          test "$dockerhub_digest" = "$ghcr_digest"

          for ref in "$dockerhub_ref" "$ghcr_ref"; do
            docker buildx imagetools inspect "${ref}@${BUILD_DIGEST}" --raw \
              > "/tmp/${PHP_MINOR}-${ref%%/*}.json"
          done
          python3 - "$PHP_MINOR" <<'PY'
          import json
          import pathlib
          import sys

          minor = sys.argv[1]
          required = {('linux', 'amd64'), ('linux', 'arm64')}
          paths = list(pathlib.Path('/tmp').glob(f'{minor}-*.json'))
          if len(paths) != 2:
              raise SystemExit(f'expected two registry indexes, found {len(paths)}')
          for path in paths:
              index = json.loads(path.read_text())
              platforms = {
                  (item.get('platform', {}).get('os'), item.get('platform', {}).get('architecture'))
                  for item in index.get('manifests', [])
              }
              if not required <= platforms:
                  raise SystemExit(f'{path.name} is missing required platforms: {platforms}')
          PY
          printf 'published php=%s digest=%s registries=dockerhub,ghcr\n' \
            "$PHP_MINOR" "$BUILD_DIGEST"
