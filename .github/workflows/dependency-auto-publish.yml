name: dependency-auto-publish
run-name: dependency-publish-${{ github.event.action == 'fpm-ghcr-backfill' && 'backfill-ghcr' || github.event.action == 'fpm-dependency-publish-replay' && 'automatic-replay' || 'automatic' }}-${{ github.sha }}

on:
  push:
    branches: [main]
    paths:
      - build/versions.json
  repository_dispatch:
    types: [fpm-ghcr-backfill, fpm-dependency-publish-replay]

concurrency:
  group: fpm-production-promotion
  cancel-in-progress: false

permissions:
  contents: read

env:
  DOCKERHUB_REPOSITORY: docker.io/woosungchoi/fpm-alpine
  GHCR_REPOSITORY: ghcr.io/woosungchoi/fpm-alpine

jobs:
  prepare:
    name: Validate trusted publication request
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
      source_sha: ${{ steps.mode.outputs.source_sha }}
      base_sha: ${{ steps.mode.outputs.base_sha }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Validate owner dispatch envelope before checkout
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          EVENT_PAYLOAD_JSON: ${{ toJSON(github.event.client_payload) }}
          EVENT_ACTOR: ${{ github.actor }}
          EVENT_ACTOR_ID: ${{ github.actor_id }}
          EVENT_REPOSITORY: ${{ github.repository }}
          EVENT_REF: ${{ github.ref }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re

          def fail(message):
              raise SystemExit(message)

          event_name = os.environ["EVENT_NAME"]
          if os.environ["EVENT_REPOSITORY"] != "woosungchoi/fpm-alpine":
              fail("dependency publication repository mismatch")
          if os.environ["EVENT_REF"] != "refs/heads/main" or re.fullmatch(
              r"[0-9a-f]{40}", os.environ["EVENT_SHA"]
          ) is None:
              fail("dependency publication event is not exact default-branch HEAD")
          payload = json.loads(os.environ["EVENT_PAYLOAD_JSON"] or "null")
          if event_name == "push":
              if payload not in (None, {}):
                  fail("push event unexpectedly contains a dispatch payload")
          elif event_name == "repository_dispatch":
              action = os.environ["EVENT_ACTION"]
              expected_operation = {
                  "fpm-ghcr-backfill": "backfill-ghcr",
                  "fpm-dependency-publish-replay": "automatic-replay",
              }.get(action)
              if expected_operation is None:
                  fail("unexpected dependency publication dispatch action")
              if os.environ["EVENT_ACTOR"] != "woosungchoi" or os.environ["EVENT_ACTOR_ID"] != "5674610":
                  fail("dependency publication dispatcher is not the pinned owner")
              if not isinstance(payload, dict) or set(payload) != {"operation", "source_sha"}:
                  fail("dispatch payload must contain exactly operation and source_sha")
              if payload.get("operation") != expected_operation:
                  fail("dispatch operation mismatch")
              if not isinstance(payload.get("source_sha"), str) or re.fullmatch(
                  r"[0-9a-f]{40}", payload["source_sha"]
              ) is None:
                  fail("dispatch source_sha is invalid")
          else:
              fail("unsupported dependency publication event")
          PY

      - name: Checkout trusted default-branch revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Select fail-closed publisher mode
        id: mode
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_REF: ${{ github.ref }}
          WORKFLOW_SHA: ${{ github.sha }}
          REQUESTED_OPERATION: ${{ github.event.client_payload.operation }}
          REQUESTED_SOURCE_SHA: ${{ github.event.client_payload.source_sha }}
        run: |
          set -euo pipefail
          test "$EVENT_REF" = refs/heads/main
          case "$EVENT_NAME:$EVENT_ACTION" in
            push:)
              mode=automatic
              source_sha="$WORKFLOW_SHA"
              base_sha="$EVENT_BEFORE"
              ;;
            repository_dispatch:fpm-ghcr-backfill)
              test "$REQUESTED_OPERATION" = backfill-ghcr
              [[ "$REQUESTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
              source_sha="$REQUESTED_SOURCE_SHA"
              mode=backfill-ghcr
              base_sha=
              ;;
            repository_dispatch:fpm-dependency-publish-replay)
              test "$REQUESTED_OPERATION" = automatic-replay
              [[ "$REQUESTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
              source_sha="$REQUESTED_SOURCE_SHA"
              mode=automatic
              base_sha=
              ;;
            *)
              echo "unsupported dependency publisher event/action" >&2
              exit 64
              ;;
          esac
          git cat-file -e "${source_sha}^{commit}"
          git merge-base --is-ancestor "$source_sha" "$WORKFLOW_SHA"
          if [ "$EVENT_NAME:$EVENT_ACTION" = repository_dispatch:fpm-dependency-publish-replay ]; then
            base_sha="$(git rev-parse "${source_sha}^")"
            source_versions_oid="$(git rev-parse "${source_sha}:build/versions.json")"
            workflow_versions_oid="$(git rev-parse "${WORKFLOW_SHA}:build/versions.json")"
            test "$source_versions_oid" = "$workflow_versions_oid"
          fi
          {
            echo "mode=$mode"
            echo "source_sha=$source_sha"
            echo "base_sha=$base_sha"
          } >> "$GITHUB_OUTPUT"

      - name: Require an eligible dependency-only main merge
        if: steps.mode.outputs.mode == 'automatic'
        env:
          BASE_SHA: ${{ steps.mode.outputs.base_sha }}
          SOURCE_SHA: ${{ steps.mode.outputs.source_sha }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$BASE_SHA" != 0000000000000000000000000000000000000000
          test "$(git rev-parse HEAD)" = "$WORKFLOW_SHA"
          git merge-base --is-ancestor "$SOURCE_SHA" "$WORKFLOW_SHA"
          python3 scripts/evaluate-auto-promotion.py \
            --base-sha "$BASE_SHA" \
            --head-sha "$SOURCE_SHA" \
            --output /tmp/dependency-publish-eligibility.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path("/tmp/dependency-publish-eligibility.json").read_text())
          if result.get("eligible") is not True:
              raise SystemExit("merged main change is not an eligible dependency update")
          PY

      - name: Require permanent legacy publisher cutover for automatic mutation
        if: steps.mode.outputs.mode == 'automatic'
        env:
          LEGACY_PUBLISHER_DISABLED: ${{ vars.LEGACY_PUBLISHER_DISABLED }}
          DOCKERHUB_TAG_POLICY_ENFORCED: ${{ vars.DOCKERHUB_TAG_POLICY_ENFORCED }}
        run: |
          test "$LEGACY_PUBLISHER_DISABLED" = true
          test "$DOCKERHUB_TAG_POLICY_ENFORCED" = true

      - name: Bind backfill source SHA to its exact release manifest
        if: steps.mode.outputs.mode == 'backfill-ghcr'
        env:
          SOURCE_SHA: ${{ steps.mode.outputs.source_sha }}
        run: |
          set -euo pipefail
          source_manifest="$(mktemp)"
          trap 'rm -f "$source_manifest"' EXIT
          git show "${SOURCE_SHA}:build/versions.json" > "$source_manifest"
          ./scripts/validate-backfill-source-manifest.py \
            build/versions.json "$source_manifest"

      - name: Validate versions and prepare exact active matrix
        id: matrix
        run: |
          set -euo pipefail
          matrix="$(./scripts/validate-versions.py --matrix | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          rows = [row for row in data["include"] if row["arch"] == "amd64"]
          if len(rows) != len({row["php_minor"] for row in rows}):
              raise SystemExit("automatic matrix contains duplicate PHP minors")
          print(json.dumps({"include": rows}, separators=(",", ":")))
          '
          )"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  canary:
    name: Build and verify GHCR canary
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write # Keyless Cosign signing for the exact GHCR canary subject.
      packages: write # Push the non-moving GHCR canary and its OCI referrers.
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Checkout trusted publisher revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Checkout exact image source revision
        if: needs.prepare.outputs.mode == 'automatic'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          path: image-source
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.2

      - name: Log in to GHCR canary repository
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Require a unique no-clobber GHCR canary tag
        env:
          CANARY_REF: ghcr.io/woosungchoi/fpm-alpine:canary-${{ matrix.php_minor }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: ./scripts/assert-image-tag-absent.sh "$CANARY_REF"

      - name: Resolve reproducible build metadata
        id: metadata
        if: needs.prepare.outputs.mode == 'automatic'
        env:
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
        run: |
          set -euo pipefail
          source_date_epoch="$(git show -s --format=%ct "$SOURCE_SHA")"
          created="$(git show -s --format=%cI "$SOURCE_SHA")"
          [[ "$source_date_epoch" =~ ^[0-9]+$ ]]
          echo "source_date_epoch=$source_date_epoch" >> "$GITHUB_OUTPUT"
          echo "created=$created" >> "$GITHUB_OUTPUT"

      - name: Build and push immutable GHCR canary
        id: build
        if: needs.prepare.outputs.mode == 'automatic'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: image-source
          file: image-source/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: ghcr.io/woosungchoi/fpm-alpine:canary-${{ matrix.php_minor }}-${{ github.run_id }}-${{ github.run_attempt }}
          build-args: |
            PHP_BASE_IMAGE=${{ matrix.php_base_image }}
            IMAGICK_URL=${{ matrix.imagick_url }}
            IMAGICK_SHA256=${{ matrix.imagick_sha256 }}
            REDIS_URL=${{ matrix.redis_url }}
            REDIS_SHA256=${{ matrix.redis_sha256 }}
            APCU_URL=${{ matrix.apcu_url }}
            APCU_SHA256=${{ matrix.apcu_sha256 }}
            OCI_SOURCE=https://github.com/woosungchoi/fpm-alpine
            OCI_REVISION=${{ needs.prepare.outputs.source_sha }}
            OCI_VERSION=${{ matrix.php_patch }}
            OCI_CREATED=${{ steps.metadata.outputs.created }}
            SOURCE_DATE_EPOCH=${{ steps.metadata.outputs.source_date_epoch }}

      - name: Verify and copy exact Docker Hub source into GHCR canary
        id: backfill
        if: needs.prepare.outputs.mode == 'backfill-ghcr'
        env:
          PHP_MINOR: ${{ matrix.php_minor }}
          PHP_PATCH: ${{ matrix.php_patch }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          CANARY_REF: ghcr.io/woosungchoi/fpm-alpine:canary-${{ matrix.php_minor }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          source_digest="$(./scripts/resolve-image-digest.sh "${DOCKERHUB_REPOSITORY}:${PHP_MINOR}")"
          [[ "$source_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          ./scripts/verify-published-dockerhub-image.sh \
            "${DOCKERHUB_REPOSITORY}@${source_digest}" \
            "$SOURCE_SHA" "$PHP_PATCH" publisher-reports/dockerhub-source
          docker buildx imagetools create \
            --tag "$CANARY_REF" \
            "${DOCKERHUB_REPOSITORY}@${source_digest}"
          echo "dockerhub_source_digest=$source_digest" >> "$GITHUB_OUTPUT"

      - name: Resolve, sign, and freeze registry-specific canary metadata
        id: subject
        env:
          MODE: ${{ needs.prepare.outputs.mode }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          PHP_MINOR: ${{ matrix.php_minor }}
          PHP_PATCH: ${{ matrix.php_patch }}
          CANARY_REF: ghcr.io/woosungchoi/fpm-alpine:canary-${{ matrix.php_minor }}-${{ github.run_id }}-${{ github.run_attempt }}
          BUILD_DIGEST: ${{ steps.build.outputs.digest }}
          DOCKERHUB_SOURCE_DIGEST: ${{ steps.backfill.outputs.dockerhub_source_digest }}
        run: |
          set -euo pipefail
          ghcr_digest="$(./scripts/resolve-image-digest.sh "$CANARY_REF")"
          [[ "$ghcr_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          if [ "$MODE" = automatic ]; then
            test "$ghcr_digest" = "$BUILD_DIGEST"
            dockerhub_source_json=null
          else
            [[ "$DOCKERHUB_SOURCE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
            dockerhub_source_json="\"$DOCKERHUB_SOURCE_DIGEST\""
          fi
          cosign sign --yes -a "fpm.operation=$MODE" \
            "${GHCR_REPOSITORY}@${ghcr_digest}"
          echo "ghcr_digest=$ghcr_digest" >> "$GITHUB_OUTPUT"
          mkdir -p publisher-reports
          python3 - "$ghcr_digest" "$CANARY_REF" "$MODE" "$dockerhub_source_json" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path
          ghcr_digest, canary_ref, mode, dockerhub_source_json = sys.argv[1:]
          payload = {
              "schema_version": 3,
              "channel": "canary",
              "publisher_mode": mode,
              "source_sha": os.environ["SOURCE_SHA"],
              "php_minor": os.environ["PHP_MINOR"],
              "php_patch": os.environ["PHP_PATCH"],
              "run_id": int(os.environ["GITHUB_RUN_ID"]),
              "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "canonical_registry": "ghcr.io",
              "canonical_repository": "ghcr.io/woosungchoi/fpm-alpine",
              "canonical_ref": canary_ref,
              "ghcr_digest": ghcr_digest,
              "dockerhub_source_digest": json.loads(dockerhub_source_json),
              "platforms": ["linux/amd64", "linux/arm64"],
          }
          Path("publisher-reports/canary-metadata.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n"
          )
          PY

      - name: Require anonymous GHCR manifest and runtime access
        env:
          GHCR_SUBJECT: ghcr.io/woosungchoi/fpm-alpine@${{ steps.subject.outputs.ghcr_digest }}
        run: |
          set -euo pipefail
          anonymous_config="$(mktemp -d)"
          trap 'rm -rf "$anonymous_config"' EXIT
          for platform in linux/amd64 linux/arm64; do
            platform_subject="$(DOCKER_CONFIG="$anonymous_config" \
              ./scripts/resolve-platform-image.py "$GHCR_SUBJECT" "$platform")"
            DOCKER_CONFIG="$anonymous_config" docker run --rm --platform "$platform" \
              --entrypoint php "$platform_subject" -r \
              'exit(PHP_VERSION_ID >= 80200 ? 0 : 1);'
          done

      - name: Verify exact GHCR canary supply chain and runtime
        env:
          GHCR_SUBJECT: ghcr.io/woosungchoi/fpm-alpine@${{ steps.subject.outputs.ghcr_digest }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          PHP_PATCH: ${{ matrix.php_patch }}
          EXPECTED_PUBLISHER_WORKFLOW: dependency-auto-publish.yml
          EXPECTED_OPERATION: ${{ needs.prepare.outputs.mode }}
        run: |
          ./scripts/verify-canary-image.sh \
            "$GHCR_SUBJECT" "$SOURCE_SHA" "$PHP_PATCH" publisher-reports

      - name: Verify backfill source and GHCR canary semantic parity
        if: needs.prepare.outputs.mode == 'backfill-ghcr'
        env:
          DOCKERHUB_SOURCE_DIGEST: ${{ steps.backfill.outputs.dockerhub_source_digest }}
          GHCR_DIGEST: ${{ steps.subject.outputs.ghcr_digest }}
        run: |
          set -euo pipefail
          [[ "$DOCKERHUB_SOURCE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$GHCR_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          ./scripts/verify-image-parity.py \
            "${DOCKERHUB_REPOSITORY}@${DOCKERHUB_SOURCE_DIGEST}" \
            "${GHCR_REPOSITORY}@${GHCR_DIGEST}" \
            --output publisher-reports/backfill-source-parity.json

      - name: Scan exact GHCR canary subject
        env:
          GHCR_DIGEST: ${{ steps.subject.outputs.ghcr_digest }}
        run: |
          set -euo pipefail
          for platform in linux/amd64 linux/arm64; do
            ./scripts/scan-image.sh "$GHCR_REPOSITORY" "$GHCR_DIGEST" \
              publisher-reports/scan "$platform"
          done

      - name: Upload immutable canary evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: publisher-auto-canary-${{ matrix.php_minor }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: publisher-reports/
          if-no-files-found: error

  promote:
    name: Promote verified publication transaction
    needs: [prepare, canary]
    if: needs.prepare.result == 'success' && needs.canary.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: fpm-auto-production
    permissions:
      actions: read # Download exact canary artifacts from this workflow run.
      contents: write # Create/delete durable no-clobber transaction journal refs.
      id-token: write # Keyless Cosign signing for promoted exact subjects.
      packages: write # Create GHCR rollback pins, aliases, and OCI referrers.
    steps:
      - name: Checkout trusted publisher revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.2

      - name: Install checksum-pinned Crane
        if: needs.prepare.outputs.mode == 'automatic'
        env:
          CRANE_VERSION: v0.21.8
          CRANE_SHA256: 59b59f68ee37aba51f5523d69ec779ee925d9be4e279f9220eca357267f2ee67
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/go-containerregistry_Linux_x86_64.tar.gz"
          bindir="$RUNNER_TEMP/crane-bin"
          curl --fail --location --silent --show-error --retry 3 \
            "https://github.com/google/go-containerregistry/releases/download/${CRANE_VERSION}/go-containerregistry_Linux_x86_64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$CRANE_SHA256" "$archive" | sha256sum --check --strict
          mkdir -p "$bindir"
          tar --extract --gzip --file "$archive" --directory "$bindir" crane
          "$bindir/crane" version
          echo "$bindir" >> "$GITHUB_PATH"

      - name: Download current-run canary evidence only
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: publisher-auto-canary-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: canary-evidence

      - name: Validate exact artifact set and capture unauthenticated baselines
        env:
          MODE: ${{ needs.prepare.outputs.mode }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
        run: |
          set -euo pipefail
          mkdir -p publisher-reports
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          mode = os.environ["MODE"]
          source_sha = os.environ["SOURCE_SHA"]
          run_id = int(os.environ["GITHUB_RUN_ID"])
          run_attempt = int(os.environ["GITHUB_RUN_ATTEMPT"])
          versions = json.load(open("build/versions.json"))["versions"]
          active = [
              (minor, row["patch"])
              for minor, row in versions.items()
              if row["support"] in {"active", "security-only"}
          ]
          evidence_root = Path("canary-evidence")
          expected_dirs = {
              f"publisher-auto-canary-{minor}-{run_id}-{run_attempt}" for minor, _ in active
          }
          observed_dirs = {path.name for path in evidence_root.iterdir() if path.is_dir()}
          if observed_dirs != expected_dirs:
              raise SystemExit(
                  f"canary artifact set mismatch: expected={sorted(expected_dirs)} observed={sorted(observed_dirs)}"
              )
          units = []
          for minor, patch in active:
              evidence = evidence_root / f"publisher-auto-canary-{minor}-{run_id}-{run_attempt}"
              subprocess.run([
                  "./scripts/validate-canary-metadata.py", str(evidence), source_sha,
                  minor, patch, str(run_id), str(run_attempt), mode,
              ], check=True)
              metadata_files = list(evidence.glob("**/canary-metadata.json"))
              if len(metadata_files) != 1:
                  raise SystemExit(f"expected exactly one metadata file for {minor}")
              metadata = json.loads(metadata_files[0].read_text())
              resolve = lambda ref: subprocess.check_output(
                  ["./scripts/resolve-image-digest.sh", ref], text=True
              ).strip()
              previous_dockerhub = resolve(f"docker.io/woosungchoi/fpm-alpine:{minor}")
              previous_ghcr = resolve(f"ghcr.io/woosungchoi/fpm-alpine:{minor}")
              dockerhub_source = metadata["dockerhub_source_digest"]
              if mode == "backfill-ghcr" and dockerhub_source != previous_dockerhub:
                  raise SystemExit(f"backfill source moved before plan capture: {minor}")
              units.append({
                  "php_minor": minor,
                  "php_patch": patch,
                  "canary_ref": metadata["canonical_ref"],
                  "target_ghcr_digest": metadata["ghcr_digest"],
                  "target_dockerhub_digest": previous_dockerhub if mode == "backfill-ghcr" else None,
                  "dockerhub_source_digest": dockerhub_source,
                  "previous_dockerhub_digest": previous_dockerhub,
                  "previous_ghcr_digest": previous_ghcr,
                  "rollback_dockerhub_ref": None,
                  "rollback_dockerhub_backup_digest": None,
                  "rollback_ghcr_ref": None,
                  "rollback_ghcr_digest": None,
                  "platforms": ["linux/amd64", "linux/arm64"],
              })
          payload = {
              "schema_version": 1,
              "operation": mode,
              "repository": os.environ["GITHUB_REPOSITORY"],
              "workflow_path": ".github/workflows/dependency-auto-publish.yml",
              "workflow_sha": os.environ["GITHUB_SHA"],
              "run_id": run_id,
              "run_attempt": run_attempt,
              "source_sha": source_sha,
              "release_units": units,
          }
          Path("publisher-reports/promotion-plan.draft.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n"
          )
          PY

      - name: Validate strict draft plan before credentials
        env:
          OPERATION: ${{ needs.prepare.outputs.mode }}
          WORKFLOW_SHA: ${{ github.sha }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          ./scripts/validate-auto-promotion-plan.py \
            publisher-reports/promotion-plan.draft.json \
            --operation "$OPERATION" \
            --workflow-sha "$WORKFLOW_SHA" \
            --source-sha "$SOURCE_SHA" \
            --run-id "$RUN_ID" \
            --run-attempt "$RUN_ATTEMPT" \
            --draft

      - name: Freeze deterministic final plan before any registry write
        id: plan
        env:
          MODE: ${{ needs.prepare.outputs.mode }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          source = Path("publisher-reports/promotion-plan.draft.json")
          payload = json.loads(source.read_text())
          mode = os.environ["MODE"]
          run_id = int(os.environ["GITHUB_RUN_ID"])
          run_attempt = int(os.environ["GITHUB_RUN_ATTEMPT"])
          for unit in payload["release_units"]:
              minor = unit["php_minor"]
              unit["rollback_ghcr_ref"] = (
                  "ghcr.io/woosungchoi/fpm-alpine:"
                  f"rollback-auto-ghcr-{minor}-{run_id}-{run_attempt}"
              )
              unit["rollback_ghcr_digest"] = unit["previous_ghcr_digest"]
              if mode == "automatic":
                  unit["target_dockerhub_digest"] = unit["target_ghcr_digest"]
                  unit["rollback_dockerhub_ref"] = (
                      "ghcr.io/woosungchoi/fpm-alpine:"
                      f"rollback-auto-dockerhub-{minor}-{run_id}-{run_attempt}"
                  )
                  unit["rollback_dockerhub_backup_digest"] = unit[
                      "previous_dockerhub_digest"
                  ]
          destination = Path("publisher-reports/promotion-plan.json")
          temporary = destination.with_name(f".{destination.name}.tmp")
          with temporary.open("w") as handle:
              json.dump(payload, handle, indent=2, sort_keys=True)
              handle.write("\n")
              handle.flush()
              os.fsync(handle.fileno())
          os.replace(temporary, destination)
          directory_fd = os.open(destination.parent, os.O_RDONLY)
          try:
              os.fsync(directory_fd)
          finally:
              os.close(directory_fd)
          PY
          ./scripts/validate-auto-promotion-plan.py \
            publisher-reports/promotion-plan.json \
            --operation "$MODE" \
            --workflow-sha "$GITHUB_SHA" \
            --source-sha "$SOURCE_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT"
          plan_sha256="$(sha256sum publisher-reports/promotion-plan.json | cut -d' ' -f1)"
          [[ "$plan_sha256" =~ ^[0-9a-f]{64}$ ]]
          printf '%s  %s\n' "$plan_sha256" promotion-plan.json \
            > publisher-reports/promotion-plan.sha256
          echo "plan_sha256=$plan_sha256" >> "$GITHUB_OUTPUT"

      - name: Upload frozen plan before the first registry write
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: publisher-auto-plan-${{ github.run_id }}-${{ github.run_attempt }}-${{ steps.plan.outputs.plan_sha256 }}
          path: |
            publisher-reports/promotion-plan.json
            publisher-reports/promotion-plan.sha256
          if-no-files-found: error

      - name: Verify permanent Docker Hub cutover before automatic credentials
        if: needs.prepare.outputs.mode == 'automatic'
        env:
          LEGACY_PUBLISHER_DISABLED: ${{ vars.LEGACY_PUBLISHER_DISABLED }}
          DOCKERHUB_TAG_POLICY_ENFORCED: ${{ vars.DOCKERHUB_TAG_POLICY_ENFORCED }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$LEGACY_PUBLISHER_DISABLED" = true
          test "$DOCKERHUB_TAG_POLICY_ENFORCED" = true
          read -r current_main current_ref < <(
            git ls-remote --exit-code origin refs/heads/main
          )
          test "$current_ref" = refs/heads/main
          test "$current_main" = "$WORKFLOW_SHA"
          ./scripts/verify-permanent-dockerhub-cutover.py \
            --output publisher-reports/dockerhub-cutover-before-credentials.json

      - name: Acquire durable single-transaction writer fence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./scripts/transaction-journal.py begin \
            publisher-reports/promotion-plan.json
          ./scripts/transaction-journal.py assert-owner \
            publisher-reports/promotion-plan.json

      - name: Log in to Docker Hub mutation boundary
        if: needs.prepare.outputs.mode == 'automatic'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR mutation boundary
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Materialize frozen immutable subjects without moving aliases
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ needs.prepare.outputs.mode }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
        run: |
          set -euo pipefail
          ./scripts/transaction-journal.py assert-owner \
            publisher-reports/promotion-plan.json
          ./scripts/validate-auto-promotion-plan.py \
            publisher-reports/promotion-plan.json --emit-tsv > /tmp/final-plan.tsv
          if [ "$MODE" = automatic ]; then
            ./scripts/prune-dockerhub-tags.py plan \
              publisher-reports/dockerhub-inventory-before-stage.json
          fi
          while IFS=$'\t' read -r minor _patch _source _canary target_ghcr target_dockerhub \
              _dockerhub_source previous_dockerhub previous_ghcr rollback_dockerhub_ref \
              rollback_dockerhub_digest rollback_ghcr_ref rollback_ghcr_digest; do
            ./scripts/transaction-journal.py assert-owner \
              publisher-reports/promotion-plan.json
            ./scripts/transaction-journal.py prepare-attempt \
              publisher-reports/promotion-plan.json "$minor" pin-ghcr
            if observed="$(./scripts/resolve-image-digest.sh "$rollback_ghcr_ref" 2>/dev/null)"; then
              test "$observed" = "$rollback_ghcr_digest"
            else
              ./scripts/assert-image-tag-absent.sh "$rollback_ghcr_ref"
              docker buildx imagetools create --tag "$rollback_ghcr_ref" \
                "${GHCR_REPOSITORY}@${previous_ghcr}"
              observed="$(./scripts/resolve-image-digest.sh "$rollback_ghcr_ref")"
              test "$observed" = "$rollback_ghcr_digest"
            fi
            ./scripts/transaction-journal.py prepare-complete \
              publisher-reports/promotion-plan.json "$minor" pin-ghcr "$observed"
            if [ "$MODE" = automatic ]; then
              ./scripts/transaction-journal.py prepare-attempt \
                publisher-reports/promotion-plan.json "$minor" pin-dockerhub-backup
              if observed="$(./scripts/resolve-image-digest.sh "$rollback_dockerhub_ref" 2>/dev/null)"; then
                test "$observed" = "$rollback_dockerhub_digest"
              else
                ./scripts/assert-image-tag-absent.sh "$rollback_dockerhub_ref"
                docker buildx imagetools create --tag "$rollback_dockerhub_ref" \
                  "${DOCKERHUB_REPOSITORY}@${previous_dockerhub}"
                observed="$(./scripts/resolve-image-digest.sh "$rollback_dockerhub_ref")"
                test "$observed" = "$rollback_dockerhub_digest"
              fi
              ./scripts/transaction-journal.py prepare-complete \
                publisher-reports/promotion-plan.json "$minor" \
                pin-dockerhub-backup "$observed"
              test "$target_dockerhub" = "$target_ghcr"
              ./scripts/transaction-journal.py prepare-attempt \
                publisher-reports/promotion-plan.json "$minor" stage-dockerhub
              ./scripts/verify-permanent-dockerhub-cutover.py \
                --expected-state publisher-reports/dockerhub-cutover-before-credentials.json \
                --output "publisher-reports/dockerhub-cutover-before-stage-${minor}.json"
              ./scripts/transaction-journal.py assert-owner \
                publisher-reports/promotion-plan.json
              crane copy \
                "${GHCR_REPOSITORY}@${target_ghcr}" \
                "${DOCKERHUB_REPOSITORY}@${target_dockerhub}"
              observed="$(crane digest "${DOCKERHUB_REPOSITORY}@${target_dockerhub}")"
              test "$observed" = "$target_dockerhub"
              ./scripts/transaction-journal.py prepare-complete \
                publisher-reports/promotion-plan.json "$minor" stage-dockerhub "$observed"
            fi
          done < /tmp/final-plan.tsv
          if [ "$MODE" = automatic ]; then
            ./scripts/prune-dockerhub-tags.py plan \
              publisher-reports/dockerhub-inventory-after-stage.json
            cmp --silent \
              publisher-reports/dockerhub-inventory-before-stage.json \
              publisher-reports/dockerhub-inventory-after-stage.json
          fi

      - name: Revalidate permanent Docker Hub cutover at mutation boundary
        if: needs.prepare.outputs.mode == 'automatic'
        env:
          LEGACY_PUBLISHER_DISABLED: ${{ vars.LEGACY_PUBLISHER_DISABLED }}
          DOCKERHUB_TAG_POLICY_ENFORCED: ${{ vars.DOCKERHUB_TAG_POLICY_ENFORCED }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$LEGACY_PUBLISHER_DISABLED" = true
          test "$DOCKERHUB_TAG_POLICY_ENFORCED" = true
          read -r current_main current_ref < <(
            git ls-remote --exit-code origin refs/heads/main
          )
          test "$current_ref" = refs/heads/main
          test "$current_main" = "$WORKFLOW_SHA"
          ./scripts/verify-permanent-dockerhub-cutover.py \
            --expected-state publisher-reports/dockerhub-cutover-before-credentials.json \
            --output publisher-reports/dockerhub-cutover-at-mutation.json

      - name: Activate prepared transaction for moving-alias writes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./scripts/transaction-journal.py activate \
            publisher-reports/promotion-plan.json
          ./scripts/transaction-journal.py assert-owner \
            publisher-reports/promotion-plan.json

      - name: Promote exact subjects as one fail-closed transaction
        env:
          MODE: ${{ needs.prepare.outputs.mode }}
        run: |
          ./scripts/promote-auto-canaries.sh \
            "$MODE" publisher-reports/promotion-plan.json publisher-reports

      - name: Commit exact verified transaction receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: publisher-auto-committed-${{ github.run_id }}-${{ github.run_attempt }}-${{ steps.plan.outputs.plan_sha256 }}
          path: |
            publisher-reports/promotion-plan.json
            publisher-reports/promotion-plan.sha256
            publisher-reports/transaction-result.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload production transaction evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: publisher-auto-production-${{ github.run_id }}-${{ github.run_attempt }}
          path: publisher-reports/
          if-no-files-found: error

      - name: Close durable writer fence after committed receipt and evidence
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./scripts/transaction-journal.py finish \
            publisher-reports/promotion-plan.json committed \
            --result publisher-reports/transaction-result.json
