name: dependency-freshness

on:
  schedule:
    - cron: '42 4 * * 1'
  workflow_dispatch:

concurrency:
  group: freshness-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Generate dependency freshness report
        env:
          REPORT_DIR: freshness-reports
          VERSIONS_PATH: build/versions.json
        run: ./scripts/report-freshness.sh

      - name: Upload dependency freshness report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-freshness-report
          path: freshness-reports/

      - name: Create issue when dependency updates are available
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/create-dependency-freshness-issue.sh
