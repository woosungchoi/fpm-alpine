name: dependency-publish-recovery
run-name: dependency-publish-recovery-${{ github.event_name }}-${{ github.run_id }}-${{ github.run_attempt }}

on:
  repository_dispatch:
    types: [fpm-publish-recover]
  schedule:
    - cron: '*/15 * * * *'

concurrency:
  group: fpm-production-promotion
  cancel-in-progress: false

permissions:
  contents: read

env:
  DOCKERHUB_REPOSITORY: docker.io/woosungchoi/fpm-alpine
  GHCR_REPOSITORY: ghcr.io/woosungchoi/fpm-alpine

jobs:
  prepare:
    name: Validate frozen recovery request
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read # Read original workflow status and reject stale recovery.
      contents: read
    outputs:
      has_pending: ${{ steps.request.outputs.has_pending }}
      original_run_id: ${{ steps.request.outputs.original_run_id }}
      original_run_attempt: ${{ steps.request.outputs.original_run_attempt }}
      original_workflow_sha: ${{ steps.request.outputs.original_workflow_sha }}
      plan_sha256: ${{ steps.request.outputs.plan_sha256 }}
      committed_artifact_id: ${{ steps.request.outputs.committed_artifact_id }}
    steps:
      - name: Validate owner dispatch envelope before checkout
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          EVENT_PAYLOAD_JSON: ${{ toJSON(github.event.client_payload) }}
          EVENT_ACTOR: ${{ github.actor }}
          EVENT_ACTOR_ID: ${{ github.actor_id }}
          EVENT_REPOSITORY: ${{ github.repository }}
          EVENT_REF: ${{ github.ref }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re

          def fail(message):
              raise SystemExit(message)

          if os.environ["EVENT_REPOSITORY"] != "woosungchoi/fpm-alpine":
              fail("recovery repository mismatch")
          if os.environ["EVENT_REF"] != "refs/heads/main" or re.fullmatch(
              r"[0-9a-f]{40}", os.environ["EVENT_SHA"]
          ) is None:
              fail("recovery event is not exact default-branch HEAD")
          event_name = os.environ["EVENT_NAME"]
          if event_name == "schedule":
              if os.environ["EVENT_ACTION"] not in {"", "null"}:
                  fail("scheduled recovery action must be empty")
              payload = json.loads(os.environ["EVENT_PAYLOAD_JSON"])
              if payload not in (None, {}):
                  fail("scheduled recovery payload must be empty")
              raise SystemExit(0)
          if event_name != "repository_dispatch":
              fail("recovery requires owner dispatch or trusted schedule")
          if os.environ["EVENT_ACTION"] != "fpm-publish-recover":
              fail("unexpected recovery dispatch action")
          if os.environ["EVENT_ACTOR"] != "woosungchoi" or os.environ["EVENT_ACTOR_ID"] != "5674610":
              fail("recovery dispatcher is not the pinned owner")
          payload = json.loads(os.environ["EVENT_PAYLOAD_JSON"])
          expected_keys = {"operation", "original_run_id", "original_run_attempt", "plan_sha256"}
          if not isinstance(payload, dict) or set(payload) != expected_keys:
              fail("recovery payload key set mismatch")
          if payload.get("operation") != "recovery":
              fail("recovery operation mismatch")
          for name in ("original_run_id", "original_run_attempt"):
              value = payload.get(name)
              if isinstance(value, bool) or not (
                  isinstance(value, int) and value > 0
                  or isinstance(value, str) and re.fullmatch(r"[1-9][0-9]*", value)
              ):
                  fail(f"recovery {name} is invalid")
          plan_sha256 = payload.get("plan_sha256")
          if not isinstance(plan_sha256, str) or re.fullmatch(r"[0-9a-f]{64}", plan_sha256) is None:
              fail("recovery plan_sha256 is invalid")
          PY

      - name: Checkout trusted default-branch recovery code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Validate failed publisher run and pinned plan request
        id: request
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          EVENT_REF: ${{ github.ref }}
          ORIGINAL_RUN_ID: ${{ github.event.client_payload.original_run_id }}
          ORIGINAL_RUN_ATTEMPT: ${{ github.event.client_payload.original_run_attempt }}
          PLAN_SHA256: ${{ github.event.client_payload.plan_sha256 }}
        run: |
          set -euo pipefail
          test "$EVENT_REF" = refs/heads/main
          set +e
          pending_json="$(./scripts/transaction-journal.py pending)"
          pending_status=$?
          set -e
          if [ "$pending_status" -eq 3 ] && [ "$EVENT_NAME" = schedule ]; then
            echo "has_pending=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          test "$pending_status" -eq 0
          pending_tuple="$(python3 - "$pending_json" <<'PY'
          import json
          import re
          import sys
          payload = json.loads(sys.argv[1])
          expected = {
              "schema_version": 1,
              "kind": "pending",
              "repository": "woosungchoi/fpm-alpine",
              "workflow_path": ".github/workflows/dependency-auto-publish.yml",
          }
          for key, value in expected.items():
              if payload.get(key) != value:
                  raise SystemExit(f"pending transaction mismatch for {key}")
          run_id = payload.get("run_id")
          run_attempt = payload.get("run_attempt")
          plan_sha256 = payload.get("plan_sha256")
          workflow_sha = payload.get("workflow_sha")
          if (
              type(run_id) is not int or run_id <= 0
              or type(run_attempt) is not int or run_attempt <= 0
              or type(plan_sha256) is not str
              or re.fullmatch(r"[0-9a-f]{64}", plan_sha256) is None
              or type(workflow_sha) is not str
              or re.fullmatch(r"[0-9a-f]{40}", workflow_sha) is None
          ):
              raise SystemExit("pending transaction identifiers are invalid")
          print(f"{run_id}\t{run_attempt}\t{plan_sha256}\t{workflow_sha}")
          PY
          )"
          IFS=$'\t' read -r pending_run_id pending_run_attempt pending_plan_sha pending_workflow_sha \
            <<< "$pending_tuple"
          if [ "$EVENT_NAME" = schedule ]; then
            ORIGINAL_RUN_ID="$pending_run_id"
            ORIGINAL_RUN_ATTEMPT="$pending_run_attempt"
            PLAN_SHA256="$pending_plan_sha"
          else
            test "$EVENT_ACTION" = fpm-publish-recover
            [[ "$ORIGINAL_RUN_ID" =~ ^[1-9][0-9]*$ ]]
            [[ "$ORIGINAL_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
            [[ "$PLAN_SHA256" =~ ^[0-9a-f]{64}$ ]]
            test "$ORIGINAL_RUN_ID" = "$pending_run_id"
            test "$ORIGINAL_RUN_ATTEMPT" = "$pending_run_attempt"
            test "$PLAN_SHA256" = "$pending_plan_sha"
          fi
          echo "has_pending=true" >> "$GITHUB_OUTPUT"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${ORIGINAL_RUN_ID}" \
            > /tmp/original-run.json
          original_workflow_sha="$(python3 - "$ORIGINAL_RUN_ATTEMPT" <<'PY'
          import json
          import re
          import sys
          payload = json.load(open("/tmp/original-run.json"))
          expected = {
              "path": ".github/workflows/dependency-auto-publish.yml",
              "head_branch": "main",
              "status": "completed",
          }
          for key, value in expected.items():
              if payload.get(key) != value:
                  raise SystemExit(f"original publisher run mismatch for {key}")
          if payload.get("event") not in {"push", "repository_dispatch"}:
              raise SystemExit("unsupported original publisher event")
          if payload.get("conclusion") not in {"failure", "cancelled", "timed_out"}:
              raise SystemExit("recovery requires a failed, cancelled, or timed-out publisher run")
          attempt = payload.get("run_attempt")
          if type(attempt) is not int or attempt != int(sys.argv[1]):
              raise SystemExit("original publisher run attempt mismatch")
          sha = payload.get("head_sha")
          if type(sha) is not str or re.fullmatch(r"[0-9a-f]{40}", sha) is None:
              raise SystemExit("invalid original publisher workflow SHA")
          print(sha)
          PY
          )"
          test "$original_workflow_sha" = "$pending_workflow_sha"
          gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/actions/runs?status=completed&per_page=100" \
            --jq '.workflow_runs[] | [.id, .run_attempt, .path, .conclusion] | @tsv' \
            > /tmp/completed-publisher-runs.tsv
          python3 - "$ORIGINAL_RUN_ID" "$ORIGINAL_RUN_ATTEMPT" <<'PY'
          import sys
          from pathlib import Path

          original_run_id = int(sys.argv[1])
          original_run_attempt = int(sys.argv[2])
          publisher_paths = {
              ".github/workflows/dependency-auto-publish.yml",
              ".github/workflows/dependency-publish-recovery.yml",
          }
          for line in Path("/tmp/completed-publisher-runs.tsv").read_text().splitlines():
              run_id_text, run_attempt_text, path, conclusion = line.split("\t")
              run_id = int(run_id_text)
              run_attempt = int(run_attempt_text)
              is_later = (run_id, run_attempt) > (original_run_id, original_run_attempt)
              if is_later and path in publisher_paths and conclusion == "success":
                  raise SystemExit(
                      "later successful publisher run blocks stale recovery: "
                      f"{run_id}/{run_attempt} {path}"
                  )
          PY
          artifact_name="publisher-auto-committed-${ORIGINAL_RUN_ID}-${ORIGINAL_RUN_ATTEMPT}-${PLAN_SHA256}"
          artifacts_json="$(mktemp)"
          trap 'rm -f "$artifacts_json"' EXIT
          gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${ORIGINAL_RUN_ID}/artifacts?per_page=100" \
            > "$artifacts_json"
          committed_artifact_id="$(python3 - "$artifacts_json" "$artifact_name" \
            "$ORIGINAL_RUN_ID" <<'PY'
          import json
          import sys

          payload = json.load(open(sys.argv[1]))
          expected_name = sys.argv[2]
          expected_run_id = int(sys.argv[3])
          artifacts = payload.get("artifacts")
          total_count = payload.get("total_count")
          if type(artifacts) is not list or type(total_count) is not int:
              raise SystemExit("artifact inventory schema is invalid")
          if total_count != len(artifacts):
              raise SystemExit("artifact inventory is incomplete; refusing recovery")
          matches = [artifact for artifact in artifacts if artifact.get("name") == expected_name]
          if len(matches) > 1:
              raise SystemExit("duplicate committed transaction artifacts")
          if not matches:
              print("")
              raise SystemExit(0)
          artifact = matches[0]
          artifact_id = artifact.get("id")
          workflow_run = artifact.get("workflow_run")
          if (
              type(artifact_id) is not int
              or artifact_id <= 0
              or artifact.get("expired") is not False
              or type(workflow_run) is not dict
              or workflow_run.get("id") != expected_run_id
          ):
              raise SystemExit("committed transaction artifact metadata is invalid")
          print(artifact_id)
          PY
          )"
          {
            echo "original_run_id=$ORIGINAL_RUN_ID"
            echo "original_run_attempt=$ORIGINAL_RUN_ATTEMPT"
            echo "original_workflow_sha=$original_workflow_sha"
            echo "plan_sha256=$PLAN_SHA256"
            echo "committed_artifact_id=$committed_artifact_id"
          } >> "$GITHUB_OUTPUT"

  recover:
    name: Recover frozen publication transaction
    needs: prepare
    if: >-
      needs.prepare.result == 'success' &&
      needs.prepare.outputs.has_pending == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: fpm-auto-production
    permissions:
      actions: read # Download the exact frozen plan artifact from the failed run.
      contents: write # Read/update durable transaction journal refs after recovery evidence.
      id-token: write # Re-sign an exact Docker Hub subject only for automatic recovery.
      packages: write # Restore GHCR aliases and read/write frozen rollback subjects.
    steps:
      - name: Checkout trusted default-branch recovery code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download the exact frozen plan artifact from the failed run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v8.0.0
        with:
          name: publisher-auto-plan-${{ needs.prepare.outputs.original_run_id }}-${{ needs.prepare.outputs.original_run_attempt }}-${{ needs.prepare.outputs.plan_sha256 }}
          path: recovery-plan
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.prepare.outputs.original_run_id }}

      - name: Verify artifact bytes and strict plan binding before credentials
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          ORIGINAL_RUN_ID: ${{ needs.prepare.outputs.original_run_id }}
          ORIGINAL_RUN_ATTEMPT: ${{ needs.prepare.outputs.original_run_attempt }}
          ORIGINAL_WORKFLOW_SHA: ${{ needs.prepare.outputs.original_workflow_sha }}
          PLAN_SHA256: ${{ needs.prepare.outputs.plan_sha256 }}
        run: |
          set -euo pipefail
          plan_path="$(python3 - "$PLAN_SHA256" <<'PY'
          from pathlib import Path
          import sys
          root = Path("recovery-plan")
          files = {path.relative_to(root).as_posix(): path for path in root.glob("**/*") if path.is_file()}
          expected = {"promotion-plan.json", "promotion-plan.sha256"}
          if set(files) != expected:
              raise SystemExit(f"recovery artifact exact-set mismatch: {sorted(files)}")
          expected_line = f"{sys.argv[1]}  promotion-plan.json\n"
          if files["promotion-plan.sha256"].read_text() != expected_line:
              raise SystemExit("recovery checksum companion does not match the dispatch SHA")
          print(files["promotion-plan.json"])
          PY
          )"
          actual_sha256="$(sha256sum "$plan_path" | cut -d' ' -f1)"
          test "$actual_sha256" = "$PLAN_SHA256"
          cp "$plan_path" recovery-plan/pinned-promotion-plan.json
          git cat-file -e "${ORIGINAL_WORKFLOW_SHA}^{commit}" 2>/dev/null || \
            git fetch --no-tags origin "$ORIGINAL_WORKFLOW_SHA"
          git show "${ORIGINAL_WORKFLOW_SHA}:build/versions.json" \
            > recovery-plan/original-versions.json
          ./scripts/validate-auto-promotion-plan.py \
            recovery-plan/pinned-promotion-plan.json \
            --workflow-sha "$ORIGINAL_WORKFLOW_SHA" \
            --run-id "$ORIGINAL_RUN_ID" \
            --run-attempt "$ORIGINAL_RUN_ATTEMPT" \
            --versions-file recovery-plan/original-versions.json
          ./scripts/transaction-journal.py assert-owner \
            recovery-plan/pinned-promotion-plan.json
          operation="$(python3 - <<'PY'
          import json
          operation = json.load(open("recovery-plan/pinned-promotion-plan.json"))["operation"]
          if operation not in {"automatic", "backfill-ghcr"}:
              raise SystemExit("invalid recovery operation")
          print(operation)
          PY
          )"
          echo "operation=$operation" >> "$GITHUB_OUTPUT"

      - name: Download exact committed transaction receipt
        if: needs.prepare.outputs.committed_artifact_id != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v8.0.0
        with:
          artifact-ids: ${{ needs.prepare.outputs.committed_artifact_id }}
          path: committed-transaction
          merge-multiple: true
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.prepare.outputs.original_run_id }}

      - name: Validate committed result before any recovery credentials
        id: committed
        env:
          COMMITTED_ARTIFACT_ID: ${{ needs.prepare.outputs.committed_artifact_id }}
          ORIGINAL_RUN_ID: ${{ needs.prepare.outputs.original_run_id }}
          ORIGINAL_RUN_ATTEMPT: ${{ needs.prepare.outputs.original_run_attempt }}
          ORIGINAL_WORKFLOW_SHA: ${{ needs.prepare.outputs.original_workflow_sha }}
          PLAN_SHA256: ${{ needs.prepare.outputs.plan_sha256 }}
        run: |
          set -euo pipefail
          if [ -z "$COMMITTED_ARTIFACT_ID" ]; then
            echo "recovery_required=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [[ "$COMMITTED_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          ./scripts/validate-auto-transaction-result.py \
            committed-transaction \
            --run-id "$ORIGINAL_RUN_ID" \
            --run-attempt "$ORIGINAL_RUN_ATTEMPT" \
            --workflow-sha "$ORIGINAL_WORKFLOW_SHA" \
            --versions-file recovery-plan/original-versions.json \
            --expected-plan-sha256 "$PLAN_SHA256" \
            --exact-set
          mkdir -p recovery-reports/committed-transaction
          cp committed-transaction/* recovery-reports/committed-transaction/
          python3 - "$COMMITTED_ARTIFACT_ID" "$ORIGINAL_RUN_ID" \
            "$ORIGINAL_RUN_ATTEMPT" "$PLAN_SHA256" <<'PY'
          import hashlib
          import json
          import os
          import sys
          from pathlib import Path

          artifact_id, run_id, run_attempt, plan_sha256 = sys.argv[1:]
          transaction_path = Path("committed-transaction/transaction-result.json")
          payload = {
              "schema_version": 3,
              "status": "already-verified",
              "original_run_id": int(run_id),
              "original_run_attempt": int(run_attempt),
              "plan_sha256": plan_sha256,
              "committed_artifact_id": int(artifact_id),
              "transaction_result_sha256": hashlib.sha256(
                  transaction_path.read_bytes()
              ).hexdigest(),
          }
          destination = Path("recovery-reports/recovery-result.json")
          temporary = destination.with_name(f".{destination.name}.tmp")
          with temporary.open("w") as handle:
              json.dump(payload, handle, indent=2, sort_keys=True)
              handle.write("\n")
              handle.flush()
              os.fsync(handle.fileno())
          os.replace(temporary, destination)
          directory_fd = os.open(destination.parent, os.O_RDONLY)
          try:
              os.fsync(directory_fd)
          finally:
              os.close(directory_fd)
          PY
          echo "recovery_required=false" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        if: steps.committed.outputs.recovery_required == 'true'
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        if: steps.committed.outputs.recovery_required == 'true'
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Install Cosign
        if: steps.committed.outputs.recovery_required == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.2

      - name: Claim the exact pending transaction for recovery
        if: steps.committed.outputs.recovery_required == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./scripts/transaction-journal.py recover-begin \
            recovery-plan/pinned-promotion-plan.json
          ./scripts/transaction-journal.py assert-owner \
            recovery-plan/pinned-promotion-plan.json

      - name: Verify permanent Docker Hub cutover before automatic recovery credentials
        if: >-
          steps.committed.outputs.recovery_required == 'true' &&
          steps.plan.outputs.operation == 'automatic'
        env:
          LEGACY_PUBLISHER_DISABLED: ${{ vars.LEGACY_PUBLISHER_DISABLED }}
          DOCKERHUB_TAG_POLICY_ENFORCED: ${{ vars.DOCKERHUB_TAG_POLICY_ENFORCED }}
        run: |
          set -euo pipefail
          test "$LEGACY_PUBLISHER_DISABLED" = true
          test "$DOCKERHUB_TAG_POLICY_ENFORCED" = true
          mkdir -p recovery-reports
          ./scripts/verify-permanent-dockerhub-cutover.py \
            --output recovery-reports/dockerhub-cutover-before-credentials.json

      - name: Log in to Docker Hub recovery boundary
        if: >-
          steps.committed.outputs.recovery_required == 'true' &&
          steps.plan.outputs.operation == 'automatic'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR recovery boundary
        if: steps.committed.outputs.recovery_required == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Classify every alias before restoring exact baselines
        if: steps.committed.outputs.recovery_required == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          AUTO_PROMOTION_VERSIONS_FILE: recovery-plan/original-versions.json
          EXPECTED_PUBLISHER_WORKFLOW: dependency-publish-recovery.yml
          PLAN_OPERATION: ${{ steps.plan.outputs.operation }}
        run: |
          if [ "$PLAN_OPERATION" = automatic ]; then
            ./scripts/verify-permanent-dockerhub-cutover.py \
              --expected-state recovery-reports/dockerhub-cutover-before-credentials.json \
              --output recovery-reports/dockerhub-cutover-at-mutation.json
          fi
          ./scripts/promote-auto-canaries.sh recover \
            recovery-plan/pinned-promotion-plan.json recovery-reports

      - name: Upload recovery evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: publisher-auto-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: recovery-reports/
          if-no-files-found: error

      - name: Close durable writer fence after recovery evidence
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          RECOVERY_REQUIRED: ${{ steps.committed.outputs.recovery_required }}
        run: |
          status=already-verified
          if [ "$RECOVERY_REQUIRED" = true ]; then
            status=recovered
          fi
          ./scripts/transaction-journal.py finish \
            recovery-plan/pinned-promotion-plan.json "$status" \
            --result recovery-reports/recovery-result.json
