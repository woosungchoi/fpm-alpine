name: dependency-update-pr

on:
  schedule:
    - cron: '15 5 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Discover and report candidates without creating pull requests
        required: true
        type: boolean
        default: true
  # Trusted-main code revalidates the exact successful publisher run before using secrets.
  # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows: ["dependency-auto-publish"]
    types: [completed]
    branches: ["main"]

permissions: {}

concurrency:
  group: dependency-update-pr
  cancel-in-progress: false

jobs:
  discover:
    name: Discover next dependency candidate
    if: >-
      ${{ github.event_name != 'workflow_run' ||
          (github.event.workflow_run.event == 'push' &&
           github.event.workflow_run.conclusion == 'success' &&
           github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read # Rebind the exact upstream publisher run before continuing.
      contents: read
    outputs:
      eligible_count: ${{ steps.summary.outputs.eligible_count }}
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate successful automatic publisher continuation
        id: publisher
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_RUN_ID: ${{ github.event.workflow_run.id }}
          UPSTREAM_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$UPSTREAM_RUN_ID" \
            > "$RUNNER_TEMP/upstream-publisher-run.json"
          gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/actions/runs/$UPSTREAM_RUN_ID/attempts/$UPSTREAM_RUN_ATTEMPT/jobs?per_page=100" \
            > "$RUNNER_TEMP/upstream-publisher-jobs.json"
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          temporary = Path(os.environ['RUNNER_TEMP'])
          run = json.loads((temporary / 'upstream-publisher-run.json').read_text())
          expected_id = int(os.environ['UPSTREAM_RUN_ID'])
          expected_sha = os.environ['EXPECTED_SHA']
          repository = os.environ['GITHUB_REPOSITORY']
          required = {
              'id': expected_id,
              'run_attempt': int(os.environ['UPSTREAM_RUN_ATTEMPT']),
              'path': '.github/workflows/dependency-auto-publish.yml',
              'event': 'push',
              'status': 'completed',
              'conclusion': 'success',
              'head_branch': 'main',
              'head_sha': expected_sha,
          }
          mismatches = [key for key, value in required.items() if run.get(key) != value]
          if mismatches:
              raise SystemExit('publisher continuation contract mismatch: ' + ', '.join(mismatches))
          if not re.fullmatch(r'[0-9a-f]{40}', expected_sha):
              raise SystemExit('publisher continuation SHA is invalid')
          if (run.get('head_repository') or {}).get('full_name') != repository:
              raise SystemExit('publisher continuation repository mismatch')
          pages = json.loads((temporary / 'upstream-publisher-jobs.json').read_text())
          published = [
              job for page in pages for job in page['jobs']
              if re.fullmatch(r'Publish 8\.[2345] to Docker Hub and GHCR', job.get('name', ''))
          ]
          did_publish = bool(published) and all(
              job.get('status') == 'completed' and job.get('conclusion') == 'success'
              for job in published
          )
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('did_publish=' + str(did_publish).lower() + '\n')
          if not did_publish:
              print('::notice::No successful image publication in this run; skipping updater continuation.')
          PY

      - name: Require main source
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Discover dependency candidates
        if: github.event_name != 'workflow_run' || steps.publisher.outputs.did_publish == 'true'
        run: |
          set -euo pipefail
          mkdir -p dependency-candidates
          python3 scripts/resolve-dependency-candidates.py \
            --output dependency-candidates/candidates.json

      - name: Validate candidate summary
        id: summary
        if: github.event_name != 'workflow_run' || steps.publisher.outputs.did_publish == 'true'
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          data = json.loads(Path('dependency-candidates/candidates.json').read_text())
          if type(data.get('schemaVersion')) is not int or data['schemaVersion'] != 1:
              raise SystemExit('invalid candidate schema')
          candidates = data.get('candidates')
          warnings = data.get('warnings')
          if not isinstance(candidates, list) or not isinstance(warnings, list):
              raise SystemExit('invalid candidate collections')
          eligible = [row for row in candidates if row.get('eligible') is True]
          print(f'eligible_count={len(eligible)}')
          print(f'candidate_count={len(candidates)}')
          print(f'warning_count={len(warnings)}')
          PY

      - name: Upload candidate evidence
        if: ${{ always() && (github.event_name != 'workflow_run' || steps.publisher.outputs.did_publish == 'true') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-candidates-${{ github.run_id }}-${{ github.run_attempt }}
          path: dependency-candidates/
          if-no-files-found: error

  create-prs:
    name: Create next dependency pull request
    if: >-
      ${{ needs.discover.outputs.eligible_count != '' &&
          needs.discover.outputs.eligible_count != '0' &&
          vars.DEPENDENCY_AUTOMATION_ENABLED == 'true' &&
          (github.event_name == 'schedule' ||
           github.event_name == 'workflow_run' ||
           (github.event_name == 'workflow_dispatch' && inputs.dry_run == false)) }}
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: dependency-updater
    permissions:
      contents: read
    steps:
      - name: Create scoped GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.DEPENDENCY_UPDATE_APP_ID }}
          private-key: ${{ secrets.DEPENDENCY_UPDATE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: fpm-alpine
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout exact source with App token
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download candidate evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dependency-candidates-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dependency-candidates

      - name: Create only the next eligible pull request
        env:
          CANDIDATE_FILE: ${{ runner.temp }}/dependency-candidates/candidates.json
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          gh auth setup-git
          python3 - <<'PY' > /tmp/next-eligible-candidate-key
          import json
          import os
          from pathlib import Path
          data = json.loads(Path(os.environ['CANDIDATE_FILE']).read_text())
          eligible = [row for row in data.get('candidates', []) if row.get('eligible') is True]
          if not eligible or not isinstance(eligible[0].get('key'), str):
              raise SystemExit('next eligible candidate is missing or invalid')
          print(eligible[0]['key'])
          PY
          IFS= read -r candidate_key < /tmp/next-eligible-candidate-key
          test -n "$candidate_key"
          ./scripts/create-dependency-update-pr.sh \
            "$CANDIDATE_FILE" "$candidate_key"
