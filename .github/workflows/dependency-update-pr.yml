name: dependency-update-pr

on:
  schedule:
    - cron: '15 5 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Discover and report candidates without creating pull requests
        required: true
        type: boolean
        default: true

permissions: {}

concurrency:
  group: dependency-update-pr
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      eligible_count: ${{ steps.summary.outputs.eligible_count }}
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require main source
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Discover dependency candidates
        run: |
          set -euo pipefail
          mkdir -p dependency-candidates
          python3 scripts/resolve-dependency-candidates.py \
            --output dependency-candidates/candidates.json

      - name: Validate candidate summary
        id: summary
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          data = json.loads(Path('dependency-candidates/candidates.json').read_text())
          if type(data.get('schemaVersion')) is not int or data['schemaVersion'] != 1:
              raise SystemExit('invalid candidate schema')
          candidates = data.get('candidates')
          warnings = data.get('warnings')
          if not isinstance(candidates, list) or not isinstance(warnings, list):
              raise SystemExit('invalid candidate collections')
          eligible = [row for row in candidates if row.get('eligible') is True]
          print(f'eligible_count={len(eligible)}')
          print(f'candidate_count={len(candidates)}')
          print(f'warning_count={len(warnings)}')
          PY

      - name: Upload candidate evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-candidates-${{ github.run_id }}-${{ github.run_attempt }}
          path: dependency-candidates/
          if-no-files-found: error

  create-prs:
    if: >-
      ${{ needs.discover.outputs.eligible_count != '0' &&
          vars.DEPENDENCY_AUTOMATION_ENABLED == 'true' &&
          (github.event_name == 'schedule' || inputs.dry_run == false) }}
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: dependency-updater
    permissions:
      contents: read
    steps:
      - name: Create scoped GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.DEPENDENCY_UPDATE_APP_ID }}
          private-key: ${{ secrets.DEPENDENCY_UPDATE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: fpm-alpine
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout exact source with App token
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download candidate evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dependency-candidates-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dependency-candidates

      - name: Select one eligible candidate
        id: candidate
        env:
          CANDIDATE_FILE: ${{ runner.temp }}/dependency-candidates/candidates.json
        shell: bash
        run: |
          set -euo pipefail
          candidate_key="$(python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          data = json.loads(Path(os.environ['CANDIDATE_FILE']).read_text())
          eligible = [row for row in data.get('candidates', []) if row.get('eligible') is True]
          print(eligible[0]['key'] if eligible else '')
          PY
          )"
          printf 'candidate_key=%s\n' "$candidate_key" >> "$GITHUB_OUTPUT"

      - name: Acquire durable conveyor lock
        id: lock
        if: ${{ steps.candidate.outputs.candidate_key != '' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          open_automation_prs="$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --limit 100 \
            --json headRefName \
            --jq '[.[] | select(.headRefName | test("^automation/(?:base-8\\.[2-5]|pecl-(?:imagick|redis|apcu))-[0-9a-f]{12}$"))] | length')"
          test "$open_automation_prs" = 0 || {
            echo "an automation dependency PR exists without a usable conveyor lock" >&2
            exit 69
          }
          if gh api \
            "repos/$GITHUB_REPOSITORY/git/ref/heads/automation/conveyor-lock" \
            >/dev/null 2>&1; then
            echo 'acquired=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          payload="$(mktemp)"
          trap 'rm -f "$payload"' EXIT
          python3 - "$payload" "$GITHUB_SHA" <<'PY'
          import json, sys
          json.dump({"ref": "refs/heads/automation/conveyor-lock", "sha": sys.argv[2]}, open(sys.argv[1], "w"))
          PY
          if ! gh api \
            --method POST \
            "repos/$GITHUB_REPOSITORY/git/refs" \
            --input "$payload" \
            >/dev/null; then
            if gh api \
              "repos/$GITHUB_REPOSITORY/git/ref/heads/automation/conveyor-lock" \
              >/dev/null 2>&1; then
              echo 'acquired=false' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            exit 70
          fi
          lock_sha="$(gh api \
            "repos/$GITHUB_REPOSITORY/git/ref/heads/automation/conveyor-lock" \
            --jq '.object.sha')"
          test "$lock_sha" = "$GITHUB_SHA"
          echo 'acquired=true' >> "$GITHUB_OUTPUT"

      - name: Create one update pull request
        if: ${{ steps.lock.outputs.acquired == 'true' }}
        env:
          CANDIDATE_FILE: ${{ runner.temp }}/dependency-candidates/candidates.json
          CANDIDATE_KEY: ${{ steps.candidate.outputs.candidate_key }}
          PROPOSAL_DIR: ${{ runner.temp }}/dependency-proposal
          DEPENDENCY_UPDATE_APP_ID: ${{ vars.DEPENDENCY_UPDATE_APP_ID }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh auth setup-git
          ./scripts/create-dependency-update-pr.sh \
            "$CANDIDATE_FILE" \
            "$CANDIDATE_KEY" \
            "$PROPOSAL_DIR"

      - name: Upload immutable dependency proposal
        if: ${{ steps.lock.outputs.acquired == 'true' && success() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-proposal-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dependency-proposal/proposal.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
          overwrite: false
          include-hidden-files: false
