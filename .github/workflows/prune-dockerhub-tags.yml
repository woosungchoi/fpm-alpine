name: prune-dockerhub-tags
run-name: prune-dockerhub-tags-${{ github.event.client_payload.mode }}-${{ github.run_id }}

on:
  repository_dispatch:
    types: [fpm-dockerhub-prune]

permissions: {}

concurrency:
  group: ${{ github.event.client_payload.mode == 'plan' && 'prune-dockerhub-tags-plan' || 'fpm-production-promotion' }}
  cancel-in-progress: false

jobs:
  authorize:
    name: Validate owner prune dispatch
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      mode: ${{ steps.envelope.outputs.mode }}
    steps:
      - name: Validate owner dispatch envelope before checkout
        id: envelope
        env:
          EVENT_ACTION: ${{ github.event.action }}
          EVENT_PAYLOAD_JSON: ${{ toJSON(github.event.client_payload) }}
          EVENT_ACTOR: ${{ github.actor }}
          EVENT_ACTOR_ID: ${{ github.actor_id }}
          EVENT_REPOSITORY: ${{ github.repository }}
          EVENT_REF: ${{ github.ref }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re

          def fail(message):
              raise SystemExit(message)

          if os.environ["EVENT_ACTION"] != "fpm-dockerhub-prune":
              fail("unexpected prune repository_dispatch action")
          if os.environ["EVENT_ACTOR"] != "woosungchoi" or os.environ["EVENT_ACTOR_ID"] != "5674610":
              fail("prune dispatcher is not the pinned owner")
          if os.environ["EVENT_REPOSITORY"] != "woosungchoi/fpm-alpine":
              fail("prune repository mismatch")
          if os.environ["EVENT_REF"] != "refs/heads/main" or re.fullmatch(
              r"[0-9a-f]{40}", os.environ["EVENT_SHA"]
          ) is None:
              fail("prune event is not exact default-branch HEAD")

          payload = json.loads(os.environ["EVENT_PAYLOAD_JSON"])
          if not isinstance(payload, dict):
              fail("prune payload must be an object")
          mode = payload.get("mode")
          expected = {
              "plan": {"mode"},
              "archive": {
                  "mode",
                  "plan_run_id",
                  "expected_inventory_sha256",
                  "expected_deletion_plan_sha256",
              },
              "apply": {
                  "mode",
                  "plan_run_id",
                  "expected_inventory_sha256",
                  "expected_deletion_plan_sha256",
                  "confirmation",
              },
          }
          if mode not in expected or set(payload) != expected[mode]:
              fail("prune payload keys do not exactly match the requested mode")
          if mode != "plan":
              run_id = payload.get("plan_run_id")
              if isinstance(run_id, bool) or not (
                  isinstance(run_id, int) and run_id > 0
                  or isinstance(run_id, str) and re.fullmatch(r"[1-9][0-9]*", run_id)
              ):
                  fail("prune plan_run_id is invalid")
              for name in ("expected_inventory_sha256", "expected_deletion_plan_sha256"):
                  value = payload.get(name)
                  if not isinstance(value, str) or re.fullmatch(r"[0-9a-f]{64}", value) is None:
                      fail(f"prune {name} is invalid")
          if mode == "apply" and payload.get("confirmation") != "DELETE NON-ACTIVE DOCKER HUB TAGS":
              fail("prune confirmation phrase is invalid")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"mode={mode}\n")
          PY

  plan:
    name: Create read-only Docker Hub prune plan
    if: ${{ needs.authorize.outputs.mode == 'plan' }}
    needs: authorize
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Create read-only live deletion plan
        run: |
          set -euo pipefail
          mkdir -p prune-evidence
          ./scripts/prune-dockerhub-tags.py plan --output prune-evidence/deletion-plan.json
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import hashlib
          import json
          from pathlib import Path
          path = Path("prune-evidence/deletion-plan.json")
          plan = json.loads(path.read_text())
          print("## Docker Hub prune plan")
          print(f"- inventory_sha256: `{plan['inventory_sha256']}`")
          print(f"- deletion_plan_sha256: `{hashlib.sha256(json.dumps(plan, sort_keys=True, separators=(',', ':')).encode()).hexdigest()}`")
          print(f"- keep_count: `{len(plan['keep'])}`")
          print(f"- delete_count: `{len(plan['delete'])}`")
          PY

      - name: Upload immutable prune plan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dockerhub-prune-plan-${{ github.run_id }}
          path: prune-evidence/deletion-plan.json
          if-no-files-found: error
          retention-days: 30

  archive:
    name: Archive exact Docker Hub deletion candidates
    if: ${{ needs.authorize.outputs.mode == 'archive' }}
    needs: authorize
    runs-on: ubuntu-latest
    environment: fpm-production
    timeout-minutes: 240
    permissions:
      actions: read # download the exact plan artifact from its pinned run
      contents: read
      packages: write # create no-clobber GHCR archive subjects
      id-token: write # sign archived exact subjects with Cosign
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Validate archive dispatch contract
        env:
          PLAN_RUN_ID: ${{ github.event.client_payload.plan_run_id }}
          INVENTORY_SHA256: ${{ github.event.client_payload.expected_inventory_sha256 }}
          PLAN_SHA256: ${{ github.event.client_payload.expected_deletion_plan_sha256 }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$PLAN_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$INVENTORY_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$PLAN_SHA256" =~ ^[0-9a-f]{64}$ ]]
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${PLAN_RUN_ID}" > /tmp/plan-run.json
          python3 - /tmp/plan-run.json <<'PY'
          import json
          import os
          import sys
          run = json.load(open(sys.argv[1]))
          checks = {
              "conclusion": run.get("conclusion") == "success",
              "event": run.get("event") == "repository_dispatch",
              "head_branch": run.get("head_branch") == "main",
              "head_sha": run.get("head_sha") == os.environ["GITHUB_SHA"],
              "path": run.get("path") == ".github/workflows/prune-dockerhub-tags.yml",
          }
          failed = [key for key, passed in checks.items() if not passed]
          if failed:
              raise SystemExit("plan run contract failed: " + ", ".join(failed))
          PY

      - name: Download bound deletion plan
        env:
          GH_TOKEN: ${{ github.token }}
          PLAN_RUN_ID: ${{ github.event.client_payload.plan_run_id }}
          INVENTORY_SHA256: ${{ github.event.client_payload.expected_inventory_sha256 }}
          PLAN_SHA256: ${{ github.event.client_payload.expected_deletion_plan_sha256 }}
        run: |
          set -euo pipefail
          mkdir -p prune-evidence
          gh run download "$PLAN_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "dockerhub-prune-plan-${PLAN_RUN_ID}" --dir prune-evidence
          python3 - "$INVENTORY_SHA256" "$PLAN_SHA256" <<'PY'
          import hashlib
          import json
          import sys
          from pathlib import Path
          expected_inventory, expected_plan = sys.argv[1:]
          path = Path("prune-evidence/deletion-plan.json")
          plan = json.loads(path.read_text())
          actual = hashlib.sha256(json.dumps(plan, sort_keys=True, separators=(",", ":")).encode()).hexdigest()
          if plan.get("inventory_sha256") != expected_inventory:
              raise SystemExit("inventory SHA-256 mismatch")
          if actual != expected_plan:
              raise SystemExit("deletion plan SHA-256 mismatch")
          if len(plan.get("keep", [])) != 4 or not plan.get("delete"):
              raise SystemExit("unsafe deletion plan cardinality")
          PY

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Archive, sign, compare, and anonymously read every candidate
        run: |
          ./scripts/archive-dockerhub-tags.py \
            --plan prune-evidence/deletion-plan.json \
            --output prune-evidence/archive-map.json \
            --report-dir prune-evidence/archive-reports

      - name: Upload pre-deletion archive evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dockerhub-prune-archive-${{ github.run_id }}-${{ github.run_attempt }}
          path: prune-evidence/
          if-no-files-found: error
          retention-days: 90

  apply:
    name: Apply exact archived Docker Hub deletion plan
    if: ${{ needs.authorize.outputs.mode == 'apply' }}
    needs: authorize
    runs-on: ubuntu-latest
    environment: fpm-production
    timeout-minutes: 240
    permissions:
      actions: read # download the exact plan artifact from its pinned run
      contents: read
      packages: write # verify bound GHCR archive subjects before deletion
      id-token: write # sign the revalidated archive subjects before deletion
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Validate destructive dispatch contract
        env:
          PLAN_RUN_ID: ${{ github.event.client_payload.plan_run_id }}
          INVENTORY_SHA256: ${{ github.event.client_payload.expected_inventory_sha256 }}
          PLAN_SHA256: ${{ github.event.client_payload.expected_deletion_plan_sha256 }}
          CONFIRMATION: ${{ github.event.client_payload.confirmation }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$PLAN_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$INVENTORY_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$PLAN_SHA256" =~ ^[0-9a-f]{64}$ ]]
          test "$CONFIRMATION" = 'DELETE NON-ACTIVE DOCKER HUB TAGS'
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${PLAN_RUN_ID}" > /tmp/plan-run.json
          python3 - /tmp/plan-run.json <<'PY'
          import json
          import os
          import sys
          run = json.load(open(sys.argv[1]))
          checks = {
              "conclusion": run.get("conclusion") == "success",
              "event": run.get("event") == "repository_dispatch",
              "head_branch": run.get("head_branch") == "main",
              "head_sha": run.get("head_sha") == os.environ["GITHUB_SHA"],
              "path": run.get("path") == ".github/workflows/prune-dockerhub-tags.yml",
          }
          failed = [key for key, passed in checks.items() if not passed]
          if failed:
              raise SystemExit("plan run contract failed: " + ", ".join(failed))
          PY

      - name: Download bound deletion plan
        env:
          GH_TOKEN: ${{ github.token }}
          PLAN_RUN_ID: ${{ github.event.client_payload.plan_run_id }}
          INVENTORY_SHA256: ${{ github.event.client_payload.expected_inventory_sha256 }}
          PLAN_SHA256: ${{ github.event.client_payload.expected_deletion_plan_sha256 }}
        run: |
          set -euo pipefail
          mkdir -p prune-evidence
          gh run download "$PLAN_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "dockerhub-prune-plan-${PLAN_RUN_ID}" --dir prune-evidence
          python3 - "$INVENTORY_SHA256" "$PLAN_SHA256" <<'PY'
          import hashlib
          import json
          import sys
          from pathlib import Path
          expected_inventory, expected_plan = sys.argv[1:]
          path = Path("prune-evidence/deletion-plan.json")
          plan = json.loads(path.read_text())
          actual = hashlib.sha256(json.dumps(plan, sort_keys=True, separators=(",", ":")).encode()).hexdigest()
          if plan.get("inventory_sha256") != expected_inventory:
              raise SystemExit("inventory SHA-256 mismatch")
          if actual != expected_plan:
              raise SystemExit("deletion plan SHA-256 mismatch")
          if len(plan.get("keep", [])) != 4 or not plan.get("delete"):
              raise SystemExit("unsafe deletion plan cardinality")
          PY

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Archive, sign, compare, and anonymously read every candidate
        run: |
          ./scripts/archive-dockerhub-tags.py \
            --plan prune-evidence/deletion-plan.json \
            --output prune-evidence/archive-map.json \
            --report-dir prune-evidence/archive-reports

      - name: Apply exact inventory-bound deletion plan
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          INVENTORY_SHA256: ${{ github.event.client_payload.expected_inventory_sha256 }}
          PLAN_SHA256: ${{ github.event.client_payload.expected_deletion_plan_sha256 }}
          CONFIRMATION: ${{ github.event.client_payload.confirmation }}
        run: |
          ./scripts/prune-dockerhub-tags.py apply \
            --plan prune-evidence/deletion-plan.json \
            --archive-map prune-evidence/archive-map.json \
            --expected-inventory-sha256 "$INVENTORY_SHA256" \
            --expected-deletion-plan-sha256 "$PLAN_SHA256" \
            --confirmation "$CONFIRMATION" \
            --result-output prune-evidence/prune-result.json

      - name: Public unauthenticated exact-set read-back
        run: ./scripts/verify-dockerhub-tag-policy.py --json-output prune-evidence/final-tag-policy.json

      - name: Upload archive and prune evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dockerhub-prune-apply-${{ github.run_id }}-${{ github.run_attempt }}
          path: prune-evidence/
          if-no-files-found: error
          retention-days: 90
