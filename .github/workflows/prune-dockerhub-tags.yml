name: prune-dockerhub-tags
run-name: prune-dockerhub-tags-plan-${{ github.run_id }}

on:
  repository_dispatch:
    types: [fpm-dockerhub-prune]

permissions: {}

concurrency:
  group: prune-dockerhub-tags-plan
  cancel-in-progress: true

jobs:
  authorize:
    name: Validate owner prune-plan dispatch
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      mode: ${{ steps.envelope.outputs.mode }}
    steps:
      - name: Validate owner dispatch envelope before checkout
        id: envelope
        env:
          EVENT_ACTION: ${{ github.event.action }}
          EVENT_PAYLOAD_JSON: ${{ toJSON(github.event.client_payload) }}
          EVENT_ACTOR: ${{ github.actor }}
          EVENT_ACTOR_ID: ${{ github.actor_id }}
          EVENT_REPOSITORY: ${{ github.repository }}
          EVENT_REF: ${{ github.ref }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re

          def fail(message):
              raise SystemExit(message)

          if os.environ["EVENT_ACTION"] != "fpm-dockerhub-prune":
              fail("unexpected prune repository_dispatch action")
          if os.environ["EVENT_ACTOR"] != "woosungchoi" or os.environ["EVENT_ACTOR_ID"] != "5674610":
              fail("prune-plan dispatcher is not the pinned owner")
          if os.environ["EVENT_REPOSITORY"] != "woosungchoi/fpm-alpine":
              fail("prune-plan repository mismatch")
          if os.environ["EVENT_REF"] != "refs/heads/main" or re.fullmatch(
              r"[0-9a-f]{40}", os.environ["EVENT_SHA"]
          ) is None:
              fail("prune-plan event is not exact default-branch HEAD")
          payload = json.loads(os.environ["EVENT_PAYLOAD_JSON"])
          if not isinstance(payload, dict) or payload != {"mode": "plan"}:
              fail("only the exact read-only prune-plan payload is allowed")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("mode=plan\n")
          PY

  plan:
    name: Create read-only Docker Hub prune plan
    if: ${{ needs.authorize.outputs.mode == 'plan' }}
    needs: authorize
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Create read-only live deletion plan
        run: |
          set -euo pipefail
          mkdir -p prune-evidence
          ./scripts/prune-dockerhub-tags.py plan --output prune-evidence/deletion-plan.json
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import hashlib
          import json
          from pathlib import Path

          path = Path("prune-evidence/deletion-plan.json")
          plan = json.loads(path.read_text())
          canonical = json.dumps(plan, sort_keys=True, separators=(",", ":")).encode()
          print("## Docker Hub read-only prune plan")
          print(f"- inventory_sha256: `{plan['inventory_sha256']}`")
          print(f"- deletion_plan_sha256: `{hashlib.sha256(canonical).hexdigest()}`")
          print(f"- keep_count: `{len(plan['keep'])}`")
          print(f"- candidate_count: `{len(plan['delete'])}`")
          print("- Mutation authority: `disabled`")
          PY

      - name: Upload immutable read-only prune plan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dockerhub-prune-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: prune-evidence/deletion-plan.json
          if-no-files-found: error
          retention-days: 30
          overwrite: false
