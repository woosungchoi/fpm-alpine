name: publish
run-name: publish-${{ github.event.client_payload.channel }}-${{ github.event.client_payload.correlation_id || github.run_id }}

on:
  repository_dispatch:
    types: [fpm-manual-publish]

permissions: {}

concurrency:
  group: publish-canary
  cancel-in-progress: false

env:
  DOCKERHUB_REPOSITORY: docker.io/woosungchoi/fpm-alpine
  GHCR_REPOSITORY: ghcr.io/woosungchoi/fpm-alpine

jobs:
  prepare:
    name: Prepare trusted manual publication
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      created: ${{ steps.metadata.outputs.created }}
      source_date_epoch: ${{ steps.metadata.outputs.source_date_epoch }}
      release_date: ${{ steps.metadata.outputs.release_date }}
    steps:
      - name: Validate owner dispatch envelope before checkout
        env:
          EVENT_ACTION: ${{ github.event.action }}
          EVENT_PAYLOAD_JSON: ${{ toJSON(github.event.client_payload) }}
          EVENT_ACTOR: ${{ github.actor }}
          EVENT_ACTOR_ID: ${{ github.actor_id }}
          EVENT_REPOSITORY: ${{ github.repository }}
          EVENT_REF: ${{ github.ref }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re

          def fail(message):
              raise SystemExit(message)

          if os.environ["EVENT_ACTION"] != "fpm-manual-publish":
              fail("unexpected repository_dispatch action")
          if os.environ["EVENT_ACTOR"] != "woosungchoi" or os.environ["EVENT_ACTOR_ID"] != "5674610":
              fail("manual publication dispatcher is not the pinned owner")
          if os.environ["EVENT_REPOSITORY"] != "woosungchoi/fpm-alpine":
              fail("manual publication repository mismatch")
          if os.environ["EVENT_REF"] != "refs/heads/main":
              fail("manual publication must execute from the default branch")
          event_sha = os.environ["EVENT_SHA"]
          if not re.fullmatch(r"[0-9a-f]{40}", event_sha):
              fail("manual publication event SHA is invalid")

          payload = json.loads(os.environ["EVENT_PAYLOAD_JSON"])
          if not isinstance(payload, dict):
              fail("manual publication payload must be an object")
          allowed = {"channel", "version", "source_sha", "correlation_id"}
          unknown = set(payload) - allowed
          if unknown:
              fail(f"manual publication payload has unknown keys: {sorted(unknown)}")
          if not {"channel", "source_sha"} <= set(payload):
              fail("manual publication payload is missing channel or source_sha")
          channel = payload.get("channel")
          if channel != "canary":
              fail("manual publication supports only immutable GHCR canaries")
          source_sha = payload.get("source_sha")
          if not isinstance(source_sha, str) or source_sha != event_sha:
              fail("manual publication source_sha is not exact default-branch HEAD")
          correlation_id = payload.get("correlation_id")
          if correlation_id is not None and (
              not isinstance(correlation_id, str)
              or re.fullmatch(r"[A-Za-z0-9._-]{1,64}", correlation_id) is None
          ):
              fail("manual publication correlation_id is invalid")
          version = payload.get("version")
          if version is not None and (
              not isinstance(version, str) or re.fullmatch(r"8\.[2-5]", version) is None
          ):
              fail("manual publication version is invalid")

          PY

      - name: Checkout exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.client_payload.source_sha }}
          fetch-depth: 0

      - name: Validate dispatch contract
        env:
          SOURCE_SHA: ${{ github.event.client_payload.source_sha }}
          CORRELATION_ID: ${{ github.event.client_payload.correlation_id }}
          CHANNEL: ${{ github.event.client_payload.channel }}
          REQUESTED_VERSION: ${{ github.event.client_payload.version }}
          DISPATCH_SHA: ${{ github.sha }}
          DISPATCH_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$DISPATCH_REF" = 'refs/heads/main'
          test "$SOURCE_SHA" = "$DISPATCH_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git cat-file -e "${SOURCE_SHA}^{commit}"
          if [ -n "$CORRELATION_ID" ]; then
            [[ "$CORRELATION_ID" =~ ^[A-Za-z0-9._-]{1,64}$ ]]
          fi
          test "$CHANNEL" = canary
          if [ -n "$REQUESTED_VERSION" ]; then
            [[ "$REQUESTED_VERSION" =~ ^8\.[2-5]$ ]]
          fi
          ./scripts/validate-versions.py

      - name: Prepare one build per active PHP minor
        id: matrix
        env:
          REQUESTED_VERSION: ${{ github.event.client_payload.version }}
        run: |
          matrix="$(python3 - <<'PY'
          import json
          import os
          import subprocess

          rows = json.loads(subprocess.check_output(["./scripts/validate-versions.py", "--matrix"]))["include"]
          requested = os.environ.get("REQUESTED_VERSION", "")
          selected = [row for row in rows if row["arch"] == "amd64" and (not requested or row["php_minor"] == requested)]
          if not selected:
              raise SystemExit(f"no active publisher target matched {requested!r}")
          print(json.dumps({"include": selected}, separators=(",", ":")))
          PY
          )"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

      - name: Prepare immutable build metadata
        id: metadata
        run: |
          {
            echo "created=$(git show -s --format=%cI "$GITHUB_SHA")"
            echo "source_date_epoch=$(git show -s --format=%ct "$GITHUB_SHA")"
            echo "release_date=$(date -u +'%Y%m%d')"
          } >> "$GITHUB_OUTPUT"

  canary:
    name: canary (${{ matrix.php_minor }}, multi-platform)
    if: ${{ github.event.client_payload.channel == 'canary' }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write # push the non-moving GHCR canary subject
      id-token: write # obtain the keyless Cosign signing identity
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.client_payload.source_sha }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Reject an existing GHCR canary tag before push
        env:
          GHCR_REF: ${{ env.GHCR_REPOSITORY }}:canary-${{ matrix.php_minor }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          set +e
          output="$(docker buildx imagetools inspect "$GHCR_REF" 2>&1)"
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "refusing to overwrite existing GHCR canary tag: $GHCR_REF" >&2
            exit 1
          fi
          printf '%s\n' "$output" | ./scripts/is-manifest-absent.sh "$GHCR_REF" || {
            printf '%s\n' "$output" >&2
            exit "$status"
          }

      - name: Build and push non-moving canary subjects
        id: build
        env:
          SOURCE_DATE_EPOCH: ${{ needs.prepare.outputs.source_date_epoch }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.GHCR_REPOSITORY }}:canary-${{ matrix.php_minor }}-${{ github.run_id }}-${{ github.run_attempt }}
          build-args: |
            PHP_BASE_IMAGE=${{ matrix.php_base_image }}
            IMAGICK_URL=${{ matrix.imagick_url }}
            IMAGICK_SHA256=${{ matrix.imagick_sha256 }}
            REDIS_URL=${{ matrix.redis_url }}
            REDIS_SHA256=${{ matrix.redis_sha256 }}
            APCU_URL=${{ matrix.apcu_url }}
            APCU_SHA256=${{ matrix.apcu_sha256 }}
            OCI_SOURCE=${{ github.server_url }}/${{ github.repository }}
            OCI_REVISION=${{ github.event.client_payload.source_sha }}
            OCI_VERSION=${{ matrix.php_patch }}
            OCI_CREATED=${{ needs.prepare.outputs.created }}
            SOURCE_DATE_EPOCH=${{ needs.prepare.outputs.source_date_epoch }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event.client_payload.source_sha }}
            org.opencontainers.image.version=${{ matrix.php_patch }}
            org.opencontainers.image.created=${{ needs.prepare.outputs.created }}
            org.opencontainers.image.licenses=GPL-2.0-only
          cache-from: type=gha,scope=publisher-${{ matrix.php_minor }}
          cache-to: type=gha,mode=max,scope=publisher-${{ matrix.php_minor }}
          provenance: mode=max
          sbom: true

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.2

      - name: Capture and sign exact GHCR canary subject
        id: subjects
        env:
          GHCR_REF: ${{ env.GHCR_REPOSITORY }}:canary-${{ matrix.php_minor }}-${{ github.run_id }}-${{ github.run_attempt }}
          BUILD_DIGEST: ${{ steps.build.outputs.digest }}
          PHP_MINOR: ${{ matrix.php_minor }}
          PHP_PATCH: ${{ matrix.php_patch }}
        run: |
          set -euo pipefail
          ghcr_digest="$(./scripts/resolve-image-digest.sh "$GHCR_REF")"
          [[ "$ghcr_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          test "$ghcr_digest" = "$BUILD_DIGEST"
          cosign sign --yes -a fpm.operation=manual "${GHCR_REF%:*}@${ghcr_digest}"
          echo "ghcr_digest=$ghcr_digest" >> "$GITHUB_OUTPUT"
          mkdir -p publisher-reports
          python3 - "$ghcr_digest" "$GHCR_REF" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          payload = {
              "schema_version": 2,
              "channel": "canary",
              "source_sha": os.environ["GITHUB_SHA"],
              "php_minor": os.environ["PHP_MINOR"],
              "php_patch": os.environ["PHP_PATCH"],
              "run_id": int(os.environ["GITHUB_RUN_ID"]),
              "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "canonical_registry": "ghcr.io",
              "canonical_repository": "ghcr.io/woosungchoi/fpm-alpine",
              "canonical_ref": sys.argv[2],
              "ghcr_digest": sys.argv[1],
              "platforms": ["linux/amd64", "linux/arm64"],
          }
          Path("publisher-reports/canary-metadata.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n"
          )
          PY

      - name: Require anonymous GHCR manifest and runtime access
        env:
          GHCR_SUBJECT: ${{ env.GHCR_REPOSITORY }}@${{ steps.subjects.outputs.ghcr_digest }}
        run: |
          set -euo pipefail
          anonymous_config="$(mktemp -d)"
          trap 'rm -rf "$anonymous_config"' EXIT
          DOCKER_CONFIG="$anonymous_config" docker buildx imagetools inspect "$GHCR_SUBJECT" >/dev/null
          for platform in linux/amd64 linux/arm64; do
            platform_subject="$(DOCKER_CONFIG="$anonymous_config" ./scripts/resolve-platform-image.py "$GHCR_SUBJECT" "$platform")"
            DOCKER_CONFIG="$anonymous_config" docker run --rm --platform "$platform" \
              --entrypoint php "$platform_subject" -r 'exit(PHP_VERSION_ID > 0 ? 0 : 1);'
          done

      - name: Verify GHCR canary subject
        env:
          GHCR_REF: ${{ env.GHCR_REPOSITORY }}@${{ steps.subjects.outputs.ghcr_digest }}
          EXPECTED_SOURCE_SHA: ${{ github.event.client_payload.source_sha }}
          PHP_PATCH: ${{ matrix.php_patch }}
          EXPECTED_OPERATION: manual
        run: |
          ./scripts/verify-canary-image.sh \
            "$GHCR_REF" \
            "$EXPECTED_SOURCE_SHA" \
            "$PHP_PATCH" \
            "publisher-reports"

      - name: Scan exact GHCR canary subject
        env:
          GHCR_DIGEST: ${{ steps.subjects.outputs.ghcr_digest }}
        run: |
          set -euo pipefail
          for platform in linux/amd64 linux/arm64; do
            ./scripts/scan-image.sh "$GHCR_REPOSITORY" "$GHCR_DIGEST" publisher-reports/scans "$platform"
          done

      - name: Upload canary verification evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: publisher-canary-${{ matrix.php_minor }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: publisher-reports/
          if-no-files-found: error

  report-failure:
    name: Report deterministic publisher failures
    if: ${{ always() && github.ref == 'refs/heads/main' && github.event.client_payload.source_sha == github.sha && needs.prepare.result == 'success' && needs.canary.result == 'failure' }}
    needs: [prepare, canary]
    runs-on: ubuntu-latest
    permissions:
      actions: read # classify failed matrix jobs from this exact workflow run
      contents: read
      issues: write # create or update the bounded publisher failure issue
    steps:
      - name: Checkout trusted dispatch revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Create or update publisher failure issues
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ github.event.client_payload.channel }}
          REQUESTED_VERSION: ${{ github.event.client_payload.version }}
          CANARY_RUN_ID: ${{ github.event.client_payload.canary_run_id }}
          CANARY_RUN_ATTEMPT: ${{ github.event.client_payload.canary_run_attempt }}
        run: |
          set -euo pipefail
          if [ -n "$REQUESTED_VERSION" ]; then
            printf '%s\n' "$REQUESTED_VERSION" > /tmp/failure-minors.txt
          else
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?per_page=100" > /tmp/failure-jobs.json
            python3 - <<'PY' > /tmp/failure-minors.txt
          import json
          import re

          jobs = json.load(open("/tmp/failure-jobs.json")).get("jobs") or []
          failed = []
          for job in jobs:
              if job.get("conclusion") != "failure":
                  continue
              match = re.fullmatch(r"canary \((8\.[2-5]),.*", str(job.get("name", "")))
              if match:
                  failed.append(match.group(1))
          if failed:
              for minor in sorted(set(failed)):
                  print(minor)
          else:
              payload = json.load(open("build/versions.json"))
              for minor, row in payload["versions"].items():
                  if row["support"] in {"active", "security-only"}:
                      print(minor)
          PY
          fi
          if [ "$CHANNEL" = canary ]; then
            evidence_run_id="$GITHUB_RUN_ID"
            evidence_run_attempt="$GITHUB_RUN_ATTEMPT"
          else
            evidence_run_id="$CANARY_RUN_ID"
            evidence_run_attempt="$CANARY_RUN_ATTEMPT"
          fi
          while IFS= read -r minor; do
            dockerhub_digest=unknown
            ghcr_digest=unknown
            artifact="publisher-canary-${minor}-${evidence_run_id}-${evidence_run_attempt}"
            evidence_dir="/tmp/failure-evidence-${minor}"
            rm -rf "$evidence_dir"
            if gh run download "$evidence_run_id" --name "$artifact" --dir "$evidence_dir" >/dev/null 2>&1; then
              if EVIDENCE_DIR="$evidence_dir" python3 - <<'PY' > /tmp/failure-digests.env
          import json
          import os
          import re
          from pathlib import Path

          files = list(Path(os.environ["EVIDENCE_DIR"]).glob("**/canary-metadata.json"))
          if len(files) != 1:
              raise SystemExit(1)
          payload = json.loads(files[0].read_text())
          value = str(payload.get("ghcr_digest", ""))
          if not re.fullmatch(r"sha256:[0-9a-f]{64}", value):
              raise SystemExit(1)
          print(f"ghcr_digest={value}")
          PY
              then
                source /tmp/failure-digests.env
              fi
            fi
            if [ "$CHANNEL" = canary ]; then
              ref_suffix="canary-${minor}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            else
              ref_suffix="$minor"
              IMAGE_DIGEST="$dockerhub_digest" MANIFEST_REPORT_DIR=publisher-reports/failure \
                ./scripts/create-manifest-failure-issue.sh "${DOCKERHUB_REPOSITORY}:${ref_suffix}"
            fi
            IMAGE_DIGEST="$ghcr_digest" MANIFEST_REPORT_DIR=publisher-reports/failure \
              ./scripts/create-manifest-failure-issue.sh "${GHCR_REPOSITORY}:${ref_suffix}"
          done < /tmp/failure-minors.txt
