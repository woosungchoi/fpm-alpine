name: published-runtime-smoke

on:
  schedule:
    - cron: '31 6 * * 0'
  workflow_dispatch:
  # This read-only monitor checks out trusted main, never the upstream run's head.
  # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows: ["publish", "dependency-auto-publish"]
    types: [completed]
    branches: ["main"]

concurrency:
  group: published-runtime-${{ github.event.workflow_run.id || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  prepare:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      verification_mode: ${{ steps.mode.outputs.verification_mode }}
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select verification mode
        id: mode
        env:
          EVENT_NAME: ${{ github.event_name }}
          UPSTREAM_WORKFLOW_PATH: ${{ github.event.workflow_run.path }}
        run: |
          set -euo pipefail
          verification_mode=dockerhub-only
          if [ "$EVENT_NAME" = workflow_run ] && [ "$UPSTREAM_WORKFLOW_PATH" = .github/workflows/publish.yml ]; then
            verification_mode=multi-registry
          fi
          echo "verification_mode=$verification_mode" >> "$GITHUB_OUTPUT"
      - name: Validate and prepare active matrix
        id: matrix
        run: |
          ./scripts/validate-versions.py
          matrix=$(python3 - <<'PY'
          import json
          data=json.load(open('build/versions.json'))
          print(json.dumps({'include': [
              {'php_minor': minor, 'php_patch': item['patch']}
              for minor,item in data['versions'].items()
          ]}, separators=(',', ':')))
          PY
          )
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  verify:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Checkout main with protected history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Install Cosign
        if: needs.prepare.outputs.verification_mode == 'multi-registry'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Resolve published source revision
        id: source
        env:
          IMAGE_REF: docker.io/woosungchoi/fpm-alpine:${{ matrix.php_minor }}
          EXPECTED_PATCH: ${{ matrix.php_patch }}
        run: |
          set -euo pipefail
          SOURCE_INSPECT_ATTEMPTS=5
          inspected=0
          for ((attempt = 1; attempt <= SOURCE_INSPECT_ATTEMPTS; attempt++)); do
            echo "source inspect attempt ${attempt}/${SOURCE_INSPECT_ATTEMPTS}: $IMAGE_REF"
            rm -f /tmp/published-image.json.tmp
            if docker buildx imagetools inspect "$IMAGE_REF" --format '{{ json .Image }}' > /tmp/published-image.json.tmp; then
              mv /tmp/published-image.json.tmp /tmp/published-image.json
              inspected=1
              break
            fi
            if [ "$attempt" -lt "$SOURCE_INSPECT_ATTEMPTS" ]; then
              sleep 2
            fi
          done
          if [ "$inspected" -ne 1 ]; then
            echo "source inspection failed after ${SOURCE_INSPECT_ATTEMPTS} attempts: $IMAGE_REF" >&2
            exit 1
          fi
          revision=$(python3 - "$EXPECTED_PATCH" <<'PY'
          import json,re,sys
          images=json.load(open('/tmp/published-image.json'))
          image=images.get('linux/amd64')
          if not isinstance(image,dict): raise SystemExit('missing linux/amd64 image metadata')
          labels=(image.get('config') or {}).get('Labels') or (image.get('config') or {}).get('labels') or {}
          revision=labels.get('org.opencontainers.image.revision','')
          version=labels.get('org.opencontainers.image.version','')
          if not re.fullmatch(r'[0-9a-f]{40}',revision): raise SystemExit('invalid published source revision')
          if version != sys.argv[1]: raise SystemExit(f'published patch mismatch: {version!r}')
          print(revision)
          PY
          )
          git cat-file -e "${revision}^{commit}"
          git merge-base --is-ancestor "$revision" HEAD
          signing_ref=$(./scripts/resolve-publisher-signing-ref.sh "$revision")
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "signing_ref=$signing_ref" >> "$GITHUB_OUTPUT"

      - name: Verify exact multi-registry runtime and supply chain
        if: needs.prepare.outputs.verification_mode == 'multi-registry'
        env:
          DOCKERHUB_REF: docker.io/woosungchoi/fpm-alpine:${{ matrix.php_minor }}
          GHCR_REF: ghcr.io/woosungchoi/fpm-alpine:${{ matrix.php_minor }}
          EXPECTED_REVISION: ${{ steps.source.outputs.revision }}
          EXPECTED_PATCH: ${{ matrix.php_patch }}
          REPORT_DIR: published-runtime-reports/${{ matrix.php_minor }}
          SIGNING_REF: ${{ steps.source.outputs.signing_ref }}
        run: |
          ./scripts/verify-published-image.sh \
            "$DOCKERHUB_REF" \
            "$GHCR_REF" \
            "$EXPECTED_REVISION" \
            "$EXPECTED_PATCH" \
            "$REPORT_DIR" \
            "$SIGNING_REF"

      - name: Verify exact Docker Hub runtime and supply chain
        if: needs.prepare.outputs.verification_mode == 'dockerhub-only'
        env:
          DOCKERHUB_REF: docker.io/woosungchoi/fpm-alpine:${{ matrix.php_minor }}
          EXPECTED_REVISION: ${{ steps.source.outputs.revision }}
          EXPECTED_PATCH: ${{ matrix.php_patch }}
          REPORT_DIR: published-runtime-reports/${{ matrix.php_minor }}
        run: |
          ./scripts/verify-published-dockerhub-image.sh \
            "$DOCKERHUB_REF" \
            "$EXPECTED_REVISION" \
            "$EXPECTED_PATCH" \
            "$REPORT_DIR"

      - name: Scan active exact subject for fixable vulnerabilities
        env:
          DOCKERHUB_REF: docker.io/woosungchoi/fpm-alpine:${{ matrix.php_minor }}
          REPORT_DIR: published-runtime-reports/${{ matrix.php_minor }}
        run: |
          set -euo pipefail
          digest=$(./scripts/resolve-image-digest.sh "$DOCKERHUB_REF")
          for platform in linux/amd64 linux/arm64; do
            ./scripts/scan-image.sh \
              docker.io/woosungchoi/fpm-alpine \
              "$digest" \
              "$REPORT_DIR/scan" \
              "$platform"
          done

      - name: Upload published runtime evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: published-runtime-${{ matrix.php_minor }}
          path: published-runtime-reports/${{ matrix.php_minor }}/
          if-no-files-found: error
