name: published-runtime-smoke

on:
  schedule:
    - cron: '31 6 * * 0'
  workflow_dispatch:
  # Verification inputs and scripts are explicitly checked out from main.
  # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows: ["dependency-auto-publish"]
    types: [completed]
    branches: ["main"]

concurrency:
  group: published-runtime-${{ github.event.workflow_run.id || github.run_id }}
  cancel-in-progress: false

permissions:
  actions: read # Download exact publisher plan and transaction artifacts.
  contents: read
  packages: read # Read exact GHCR subjects and their OCI referrers.

jobs:
  prepare:
    name: Resolve immutable publisher evidence
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      verification_mode: ${{ steps.mode.outputs.verification_mode }}
      signing_workflow: ${{ steps.mode.outputs.signing_workflow }}
      bind_upstream_evidence: ${{ steps.mode.outputs.bind_upstream_evidence }}
    steps:
      - name: Select verification mode
        id: mode
        env:
          EVENT_NAME: ${{ github.event_name }}
          UPSTREAM_WORKFLOW_PATH: ${{ github.event.workflow_run.path }}
          UPSTREAM_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            schedule|workflow_dispatch)
              verification_mode=multi-registry
              signing_workflow=any-authorized
              bind_upstream_evidence=false
              ;;
            workflow_run)
              case "$UPSTREAM_WORKFLOW_PATH" in
                .github/workflows/dependency-auto-publish.yml)
                  [[ "$UPSTREAM_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
                  verification_mode=multi-registry
                  signing_workflow=dependency-auto-publish.yml
                  bind_upstream_evidence=true
                  ;;
                *)
                  printf 'unsupported workflow_run path: %s\n' "${UPSTREAM_WORKFLOW_PATH:-<missing>}" >&2
                  exit 64
                  ;;
              esac
              ;;
            *)
              printf 'unsupported event for published runtime verification: %s\n' "$EVENT_NAME" >&2
              exit 64
              ;;
          esac
          {
            echo "verification_mode=$verification_mode"
            echo "signing_workflow=$signing_workflow"
            echo "bind_upstream_evidence=$bind_upstream_evidence"
          } >> "$GITHUB_OUTPUT"
      - name: Revalidate exact upstream workflow run before checkout
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_RUN_ID: ${{ github.event.workflow_run.id }}
          UPSTREAM_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          UPSTREAM_WORKFLOW_PATH: ${{ github.event.workflow_run.path }}
          UPSTREAM_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          [[ "$UPSTREAM_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$UPSTREAM_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          [[ "$UPSTREAM_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$UPSTREAM_WORKFLOW_PATH" = .github/workflows/dependency-auto-publish.yml
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${UPSTREAM_RUN_ID}" \
            > /tmp/upstream-run.json
          python3 - "$UPSTREAM_RUN_ID" "$UPSTREAM_RUN_ATTEMPT" \
            "$UPSTREAM_HEAD_SHA" <<'PY'
          import json
          import sys

          payload = json.load(open("/tmp/upstream-run.json"))
          expected = {
              "id": int(sys.argv[1]),
              "run_attempt": int(sys.argv[2]),
              "path": ".github/workflows/dependency-auto-publish.yml",
              "head_branch": "main",
              "head_sha": sys.argv[3],
              "status": "completed",
              "conclusion": "success",
          }
          for key, value in expected.items():
              if payload.get(key) != value:
                  raise SystemExit(f"upstream workflow run mismatch for {key}")
          if payload.get("event") not in {"push", "repository_dispatch"}:
              raise SystemExit("unsupported upstream publisher event")
          repository = payload.get("repository")
          if type(repository) is not dict or repository.get("full_name") != "woosungchoi/fpm-alpine":
              raise SystemExit("upstream workflow repository mismatch")
          PY
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || 'main' }}
          persist-credentials: false
      - name: Validate and prepare active matrix
        id: matrix
        run: |
          ./scripts/validate-versions.py
          matrix=$(python3 - <<'PY'
          import json
          data=json.load(open('build/versions.json'))
          print(json.dumps({'include': [
              {'php_minor': minor, 'php_patch': item['patch']}
              for minor,item in data['versions'].items()
              if item['support'] in {"active", "security-only"}
          ]}, separators=(',', ':')))
          PY
          )
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  verify:
    name: Verify published runtime and supply chain
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Checkout main with protected history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || 'main' }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Install Cosign
        if: needs.prepare.outputs.verification_mode == 'multi-registry'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.2

      - name: Download exact dependency publisher transaction evidence
        if: needs.prepare.outputs.bind_upstream_evidence == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v8.0.0
        with:
          name: publisher-auto-production-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          path: upstream-transaction
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Bind exact subjects from dependency publisher result
        id: upstream
        if: needs.prepare.outputs.bind_upstream_evidence == 'true'
        env:
          UPSTREAM_RUN_ID: ${{ github.event.workflow_run.id }}
          UPSTREAM_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          UPSTREAM_WORKFLOW_SHA: ${{ github.event.workflow_run.head_sha }}
          PHP_MINOR: ${{ matrix.php_minor }}
          PHP_PATCH: ${{ matrix.php_patch }}
        run: |
          set -euo pipefail
          values_output="$(./scripts/validate-auto-transaction-result.py \
            upstream-transaction \
            --run-id "$UPSTREAM_RUN_ID" \
            --run-attempt "$UPSTREAM_RUN_ATTEMPT" \
            --workflow-sha "$UPSTREAM_WORKFLOW_SHA" \
            --minor "$PHP_MINOR" \
            --patch "$PHP_PATCH")"
          IFS=$'\t' read -r source_sha dockerhub_digest ghcr_digest operation plan_sha256 \
            <<< "$values_output"
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$dockerhub_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$ghcr_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$plan_sha256" =~ ^[0-9a-f]{64}$ ]]
          {
            echo "source_sha=$source_sha"
            echo "dockerhub_digest=$dockerhub_digest"
            echo "ghcr_digest=$ghcr_digest"
            echo "operation=$operation"
            echo "plan_sha256=$plan_sha256"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve published source revision
        id: source
        env:
          IMAGE_REF: docker.io/woosungchoi/fpm-alpine:${{ matrix.php_minor }}
          EXPECTED_PATCH: ${{ matrix.php_patch }}
          PINNED_DOCKERHUB_DIGEST: ${{ steps.upstream.outputs.dockerhub_digest }}
          PINNED_SOURCE_SHA: ${{ steps.upstream.outputs.source_sha }}
        run: |
          set -euo pipefail
          SOURCE_INSPECT_ATTEMPTS=5
          dockerhub_digest=
          if [ -n "$PINNED_DOCKERHUB_DIGEST" ]; then
            [[ "$PINNED_DOCKERHUB_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
            dockerhub_digest="$PINNED_DOCKERHUB_DIGEST"
          else
            for ((attempt = 1; attempt <= SOURCE_INSPECT_ATTEMPTS; attempt++)); do
              echo "source digest attempt ${attempt}/${SOURCE_INSPECT_ATTEMPTS}: $IMAGE_REF"
              if candidate="$(./scripts/resolve-image-digest.sh "$IMAGE_REF")" &&
                 [[ "$candidate" =~ ^sha256:[0-9a-f]{64}$ ]]; then
                dockerhub_digest="$candidate"
                break
              fi
              if [ "$attempt" -lt "$SOURCE_INSPECT_ATTEMPTS" ]; then
                sleep 2
              fi
            done
          fi
          if [ -z "$dockerhub_digest" ]; then
            echo "source digest resolution failed after ${SOURCE_INSPECT_ATTEMPTS} attempts: $IMAGE_REF" >&2
            exit 1
          fi
          dockerhub_subject="${IMAGE_REF%:*}@${dockerhub_digest}"

          inspected=0
          for ((attempt = 1; attempt <= SOURCE_INSPECT_ATTEMPTS; attempt++)); do
            echo "source inspect attempt ${attempt}/${SOURCE_INSPECT_ATTEMPTS}: $dockerhub_subject"
            rm -f /tmp/published-image.json.tmp
            if docker buildx imagetools inspect "$dockerhub_subject" --format '{{ json .Image }}' > /tmp/published-image.json.tmp; then
              mv /tmp/published-image.json.tmp /tmp/published-image.json
              inspected=1
              break
            fi
            if [ "$attempt" -lt "$SOURCE_INSPECT_ATTEMPTS" ]; then
              sleep 2
            fi
          done
          if [ "$inspected" -ne 1 ]; then
            echo "source inspection failed after ${SOURCE_INSPECT_ATTEMPTS} attempts: $dockerhub_subject" >&2
            exit 1
          fi
          revision=$(python3 - "$EXPECTED_PATCH" <<'PY'
          import json,re,sys
          images=json.load(open('/tmp/published-image.json'))
          image=images.get('linux/amd64')
          if not isinstance(image,dict): raise SystemExit('missing linux/amd64 image metadata')
          labels=(image.get('config') or {}).get('Labels') or (image.get('config') or {}).get('labels') or {}
          revision=labels.get('org.opencontainers.image.revision','')
          version=labels.get('org.opencontainers.image.version','')
          if not re.fullmatch(r'[0-9a-f]{40}',revision): raise SystemExit('invalid published source revision')
          if version != sys.argv[1]: raise SystemExit(f'published patch mismatch: {version!r}')
          print(revision)
          PY
          )
          if [ -n "$PINNED_SOURCE_SHA" ]; then
            test "$revision" = "$PINNED_SOURCE_SHA"
          fi
          git cat-file -e "${revision}^{commit}"
          git merge-base --is-ancestor "$revision" HEAD
          {
            echo "revision=$revision"
            echo "dockerhub_digest=$dockerhub_digest"
            echo "dockerhub_subject=$dockerhub_subject"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve strict multi-registry prerequisites
        id: multi
        if: needs.prepare.outputs.verification_mode == 'multi-registry'
        env:
          GHCR_REF: ghcr.io/woosungchoi/fpm-alpine:${{ matrix.php_minor }}
          EXPECTED_REVISION: ${{ steps.source.outputs.revision }}
          PINNED_GHCR_DIGEST: ${{ steps.upstream.outputs.ghcr_digest }}
          EXPECTED_SIGNING_WORKFLOW: ${{ needs.prepare.outputs.signing_workflow }}
          UPSTREAM_OPERATION: ${{ steps.upstream.outputs.operation }}
        run: |
          set -euo pipefail
          MULTI_INSPECT_ATTEMPTS=5
          ghcr_digest=
          if [ -n "$PINNED_GHCR_DIGEST" ]; then
            [[ "$PINNED_GHCR_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
            ghcr_digest="$PINNED_GHCR_DIGEST"
          else
            for ((attempt = 1; attempt <= MULTI_INSPECT_ATTEMPTS; attempt++)); do
              echo "GHCR digest attempt ${attempt}/${MULTI_INSPECT_ATTEMPTS}: $GHCR_REF"
              if candidate="$(./scripts/resolve-image-digest.sh "$GHCR_REF")" &&
                 [[ "$candidate" =~ ^sha256:[0-9a-f]{64}$ ]]; then
                ghcr_digest="$candidate"
                break
              fi
              if [ "$attempt" -lt "$MULTI_INSPECT_ATTEMPTS" ]; then
                sleep 2
              fi
            done
          fi
          if [ -z "$ghcr_digest" ]; then
            echo "GHCR digest resolution failed after ${MULTI_INSPECT_ATTEMPTS} attempts: $GHCR_REF" >&2
            exit 1
          fi
          ghcr_subject="${GHCR_REF%:*}@${ghcr_digest}"
          case "$EXPECTED_SIGNING_WORKFLOW" in
            dependency-auto-publish.yml)
              case "$UPSTREAM_OPERATION" in
                automatic|backfill-ghcr) ;;
                *) echo "invalid dependency publisher operation binding" >&2; exit 1 ;;
              esac
              operation="$UPSTREAM_OPERATION"
              signing_workflow=dependency-auto-publish.yml
              signing_ref=main
              ;;
            publish.yml)
              operation=manual
              signing_workflow=publish.yml
              signing_ref="$(./scripts/resolve-publisher-signing-ref.sh "$EXPECTED_REVISION")"
              ;;
            any-authorized)
              manual_signing_ref="$(./scripts/resolve-publisher-signing-ref.sh "$EXPECTED_REVISION")"
              resolved_operation="$(
                ./scripts/resolve-published-operation.sh \
                  "$ghcr_subject" "$manual_signing_ref"
              )"
              IFS=$'\t' read -r operation signing_workflow signing_ref <<< "$resolved_operation"
              ;;
            *) echo "unsupported signing workflow policy" >&2; exit 1 ;;
          esac
          verify_dockerhub_signature=1
          if [ "$operation" = backfill-ghcr ]; then
            verify_dockerhub_signature=0
          fi
          {
            echo "ghcr_subject=$ghcr_subject"
            echo "operation=$operation"
            echo "signing_workflow=$signing_workflow"
            echo "signing_ref=$signing_ref"
            echo "verify_dockerhub_signature=$verify_dockerhub_signature"
          } >> "$GITHUB_OUTPUT"

      - name: Verify exact multi-registry runtime and supply chain
        if: needs.prepare.outputs.verification_mode == 'multi-registry'
        env:
          DOCKERHUB_REF: ${{ steps.source.outputs.dockerhub_subject }}
          GHCR_REF: ${{ steps.multi.outputs.ghcr_subject }}
          EXPECTED_REVISION: ${{ steps.source.outputs.revision }}
          EXPECTED_PATCH: ${{ matrix.php_patch }}
          REPORT_DIR: published-runtime-reports/${{ matrix.php_minor }}
          SIGNING_REF: ${{ steps.multi.outputs.signing_ref }}
          EXPECTED_SIGNING_WORKFLOW: ${{ steps.multi.outputs.signing_workflow }}
          EXPECTED_OPERATION: ${{ steps.multi.outputs.operation }}
          VERIFY_DOCKERHUB_SIGNATURE: ${{ steps.multi.outputs.verify_dockerhub_signature }}
        run: |
          EXPECTED_PUBLISHER_WORKFLOW="$EXPECTED_SIGNING_WORKFLOW" \
          EXPECTED_OPERATION="$EXPECTED_OPERATION" \
          VERIFY_DOCKERHUB_SIGNATURE="$VERIFY_DOCKERHUB_SIGNATURE" \
            ./scripts/verify-published-image.sh \
            "$DOCKERHUB_REF" \
            "$GHCR_REF" \
            "$EXPECTED_REVISION" \
            "$EXPECTED_PATCH" \
            "$REPORT_DIR" \
            "$SIGNING_REF"

      - name: Scan active exact subject for fixable vulnerabilities
        env:
          DOCKERHUB_DIGEST: ${{ steps.source.outputs.dockerhub_digest }}
          REPORT_DIR: published-runtime-reports/${{ matrix.php_minor }}
        run: |
          set -euo pipefail
          [[ "$DOCKERHUB_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          for platform in linux/amd64 linux/arm64; do
            ./scripts/scan-image.sh \
              docker.io/woosungchoi/fpm-alpine \
              "$DOCKERHUB_DIGEST" \
              "$REPORT_DIR/scan" \
              "$platform"
          done

      - name: Upload published runtime evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: published-runtime-${{ matrix.php_minor }}
          path: published-runtime-reports/${{ matrix.php_minor }}/
          if-no-files-found: error
